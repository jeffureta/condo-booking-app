<style>
  :root {
    --primary: #1d4ed8;
    --primary-hover: #1e40af;
    --surface: #ffffff;
    --bg: #f8fafc;
    --border: #cbd5e1;
    --text: #0f172a;
    --text-muted: #475569;
    --focus-ring: #0284c7;
    --error-bg: #fee2e2;
    --error-text: #991b1b;
    --success-bg: #f0fdf4;
    --success-text: #166534;
    --card-bg: #ffffff;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    padding: 16px;
    line-height: 1.5;
  }

  .skip-link {
    position: absolute;
    top: -40px;
    left: 10px;
    background: var(--primary);
    color: #fff;
    padding: 8px 16px;
    z-index: 100;
    text-decoration: none;
    border-radius: 4px;
    font-weight: 600;
    transition: top 0.2s ease;
  }
  .skip-link:focus {
    top: 10px;
  }

  .booking-wrapper {
    max-width: 680px;
    margin: 0 auto;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    background: var(--card-bg);
  }

  .hero-banner {
    min-height: 160px;
    background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.75)), url('https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 22px;
    color: white;
  }

  .hero-banner h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .hero-banner p {
    font-size: 14px;
    opacity: 0.95;
    margin-top: 4px;
  }

  .booking-main {
    padding: 24px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 580px) {
    .form-row {
      grid-template-columns: 1fr;
    }
    .booking-main {
      padding: 16px;
    }
  }

  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text);
  }

  input, select {
    width: 100%;
    min-height: 48px;
    padding: 10px 14px;
    font-size: 15px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background-color: var(--surface);
    color: var(--text);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--focus-ring);
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
  }

  .field-hint {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  /* FullCalendar Interactive Container */
  .fc-calendar-card {
    background: #ffffff;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    padding: 16px;
  }

  .fc-toolbar-legend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .fc-legend-items {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    color: var(--text-muted);
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .legend-badge {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    display: inline-block;
  }
  .badge-available { background: #ffffff; border: 1px solid #cbd5e1; }
  .badge-booked { background: #94a3b8; }
  .badge-selected { background: var(--primary); }

  #calendarContainer {
    min-height: 420px;
  }

  /* FullCalendar Theme Refinements */
  .fc .fc-toolbar-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text);
  }
  .fc .fc-button-primary {
    background-color: #ffffff;
    color: var(--text);
    border: 1px solid var(--border);
    font-weight: 600;
    padding: 4px 10px;
    box-shadow: none;
  }
  .fc .fc-button-primary:hover,
  .fc .fc-button-primary:focus {
    background-color: #f1f5f9;
    color: var(--text);
    border-color: #94a3b8;
    box-shadow: none;
  }
  .fc .fc-button-primary:not(:disabled).fc-button-active,
  .fc .fc-button-primary:not(:disabled):active {
    background-color: var(--primary);
    color: #ffffff;
    border-color: var(--primary);
  }
  .fc .fc-daygrid-day.fc-day-today {
    background-color: #eff6ff !important;
  }
  .fc .fc-highlight {
    background: rgba(29, 78, 216, 0.22) !important;
  }
  .fc .fc-booked-event {
    cursor: not-allowed;
    font-weight: 600;
    font-size: 0.8rem;
  }

  .stay-summary-card {
    background: #eff6ff;
    border: 1.5px solid #bfdbfe;
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .stay-details {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .stay-col {
    display: flex;
    flex-direction: column;
  }

  .stay-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }

  .stay-value {
    font-size: 14px;
    font-weight: 700;
    color: #1e3a8a;
  }

  .stay-badge {
    font-size: 12px;
    font-weight: 700;
    background: #dbeafe;
    color: #1d4ed8;
    padding: 4px 10px;
    border-radius: 9999px;
  }

  .btn-submit {
    width: 100%;
    min-height: 50px;
    background: var(--primary);
    color: #ffffff;
    border: none;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
  }

  .btn-submit:hover {
    background: var(--primary-hover);
  }

  .btn-submit:disabled {
    background: #64748b;
    cursor: not-allowed;
  }

  .confirmation-box {
    display: none;
    background: var(--success-bg);
    border: 1.5px solid #86efac;
    padding: 24px;
    border-radius: 12px;
    color: var(--success-text);
    margin-top: 10px;
  }

  .calendar-actions {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .btn-cal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 16px;
    background: #ffffff;
    border: 1px solid #16a34a;
    color: #166534;
    font-weight: 600;
    font-size: 14px;
    border-radius: 8px;
    text-decoration: none;
    min-height: 44px;
    cursor: pointer;
  }
  .btn-cal:hover {
    background: #f0fdf4;
  }

  .status-announcer {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-muted);
  }
</style>
