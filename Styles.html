<style>
  :root {
    --primary: #1d4ed8;
    --primary-hover: #1e40af;
    --surface: #ffffff;
    --bg: #f8fafc;
    --border: #cbd5e1;
    --text: #0f172a;
    --text-muted: #475569;
    --focus-ring: #0284c7;
    --error-bg: #fee2e2;
    --error-text: #991b1b;
    --success-bg: #f0fdf4;
    --success-text: #166534;
    --card-bg: #ffffff;
    --tagaytay-green: #047857;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    padding: 16px;
    line-height: 1.5;
  }

  .skip-link {
    position: absolute;
    top: -40px;
    left: 10px;
    background: var(--primary);
    color: #fff;
    padding: 8px 16px;
    z-index: 100;
    text-decoration: none;
    border-radius: 4px;
    font-weight: 600;
    transition: top 0.2s ease;
  }
  .skip-link:focus {
    top: 10px;
  }

  .booking-wrapper {
    max-width: 680px;
    margin: 0 auto;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    background: var(--card-bg);
  }

  .hero-banner {
    min-height: 190px;
    background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.88)), url('https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 24px;
    color: white;
  }

  .hero-badge-row {
    margin-bottom: 8px;
  }

  .hero-pill-badge {
    display: inline-block;
    background: rgba(16, 185, 129, 0.95);
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 4px 10px;
    border-radius: 9999px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .hero-banner h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .hero-location {
    font-size: 13px;
    opacity: 0.95;
    margin-top: 4px;
    font-weight: 500;
  }

  .hero-subtext {
    font-size: 12px;
    opacity: 0.85;
    margin-top: 2px;
  }

  .booking-main {
    padding: 24px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 580px) {
    .form-row {
      grid-template-columns: 1fr;
    }
    .booking-main {
      padding: 16px;
    }
    .cal-cell {
      min-height: 48px !important;
    }
    .cal-cell-price {
      font-size: 8px !important;
    }
  }

  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--text);
  }

  input, select {
    width: 100%;
    min-height: 48px;
    padding: 10px 14px;
    font-size: 15px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background-color: var(--surface);
    color: var(--text);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--focus-ring);
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
  }

  .field-hint {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  /* Zero-Dependency Custom Calendar Grid */
  .calendar-card {
    background: #ffffff;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    padding: 16px;
    user-select: none;
    -webkit-user-select: none;
  }

  .calendar-card-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .cal-nav-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .cal-month-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text);
    margin: 0;
    min-width: 170px;
    text-align: center;
  }

  .cal-nav-btn {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 34px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    transition: all 0.15s ease;
  }

  .cal-nav-btn:hover {
    background: #f1f5f9;
    border-color: #94a3b8;
  }

  .cal-nav-btn:focus {
    outline: none;
    border-color: var(--focus-ring);
    box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
  }

  .calendar-legend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    color: var(--text-muted);
    font-size: 12px;
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .legend-badge {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    display: inline-block;
  }
  .badge-available { background: #f0fdf4; border: 1px solid #86efac; }
  .badge-booked { background: #94a3b8; }
  .badge-selected { background: var(--primary); }

  /* Season indicator banner */
  .cal-season-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 12px;
    font-size: 12px;
  }

  .cal-season-icon {
    font-size: 18px;
    line-height: 1;
  }

  .cal-season-info {
    display: flex;
    flex-direction: column;
  }

  .cal-season-title {
    font-weight: 700;
    color: #1e293b;
  }

  .cal-season-desc {
    color: var(--text-muted);
    font-size: 11px;
  }

  /* Calendar Inline Error Alert Banner */
  .cal-error-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 13px;
    color: #991b1b;
  }

  .cal-error-content {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
  }

  .cal-error-icon {
    font-size: 16px;
    flex-shrink: 0;
  }

  .cal-retry-btn {
    background: #ffffff;
    border: 1px solid #f87171;
    color: #991b1b;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .cal-retry-btn:hover {
    background: #fee2e2;
  }

  .cal-retry-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .cal-weekdays-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    padding-bottom: 8px;
    border-bottom: 1px solid #f1f5f9;
    margin-bottom: 6px;
  }

  .cal-days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    min-height: 330px;
    touch-action: none;
  }

  .cal-cell {
    aspect-ratio: 1 / 1;
    min-height: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    border: 1px solid #f1f5f9;
    background-color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    padding: 2px;
    transition: background-color 0.1s, border-color 0.1s;
  }

  .cal-cell-day {
    line-height: 1.1;
  }

  .cal-cell-price {
    font-size: 9.5px;
    font-weight: 700;
    color: var(--tagaytay-green);
    margin-top: 2px;
    line-height: 1;
    white-space: nowrap;
  }

  .cal-cell.cal-peak-date .cal-cell-price {
    color: #b91c1c;
  }

  .cal-cell:hover:not(.cal-disabled):not(.cal-booked) {
    background-color: #f0fdf4;
    border-color: #86efac;
  }

  .cal-cell.cal-other-month {
    color: #cbd5e1;
    background: #fafafa;
    border-color: transparent;
  }
  .cal-cell.cal-other-month .cal-cell-price {
    color: #94a3b8;
  }

  .cal-cell.cal-today {
    border-color: #3b82f6;
    font-weight: 700;
  }

  .cal-cell.cal-today::after {
    content: '';
    position: absolute;
    top: 4px;
    right: 4px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background-color: #2563eb;
  }

  .cal-cell.cal-disabled {
    color: #cbd5e1;
    cursor: not-allowed;
    background-color: #f8fafc;
    border-color: transparent;
  }
  .cal-cell.cal-disabled .cal-cell-price {
    display: none;
  }

  .cal-cell.cal-booked {
    background-color: #f1f5f9;
    color: #64748b;
    cursor: not-allowed;
    text-decoration: line-through;
    opacity: 0.85;
    border-color: #e2e8f0;
  }
  .cal-cell.cal-booked .cal-cell-price {
    display: none;
  }

  .cal-cell.cal-booked::before {
    content: 'Booked';
    font-size: 9px;
    text-decoration: none;
    font-weight: 600;
    color: #94a3b8;
    position: absolute;
    bottom: 3px;
  }

  /* Selection Range Highlights */
  .cal-cell.cal-selected-start {
    background-color: var(--primary) !important;
    color: #ffffff !important;
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
  }
  .cal-cell.cal-selected-start .cal-cell-price {
    color: #bfdbfe !important;
  }

  .cal-cell.cal-in-range {
    background-color: #dbeafe !important;
    color: #1e3a8a !important;
    border-radius: 0;
  }
  .cal-cell.cal-in-range .cal-cell-price {
    color: #1d4ed8 !important;
  }

  .cal-cell.cal-selected-end {
    background-color: var(--primary) !important;
    color: #ffffff !important;
    border-top-left-radius: 0;
    border-bottom-left-radius: 0;
  }
  .cal-cell.cal-selected-end .cal-cell-price {
    color: #bfdbfe !important;
  }

  .cal-cell.cal-selected-single {
    background-color: var(--primary) !important;
    color: #ffffff !important;
    border-radius: 8px !important;
  }
  .cal-cell.cal-selected-single .cal-cell-price {
    color: #bfdbfe !important;
  }

  /* Stay Summary Card & Dynamic Pricing Breakdown */
  .stay-summary-card {
    background: #eff6ff;
    border: 1.5px solid #bfdbfe;
    border-radius: 12px;
    padding: 16px;
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .stay-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding-bottom: 12px;
    border-bottom: 1px dashed #bfdbfe;
  }

  .stay-col {
    display: flex;
    flex-direction: column;
  }

  .stay-arrow {
    font-size: 16px;
    color: #3b82f6;
    font-weight: 700;
  }

  .stay-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }

  .stay-value {
    font-size: 14px;
    font-weight: 700;
    color: #1e3a8a;
  }

  .stay-badge {
    font-size: 12px;
    font-weight: 700;
    background: #dbeafe;
    color: #1d4ed8;
    padding: 4px 10px;
    border-radius: 9999px;
  }

  .stay-pricing-box {
    background: #ffffff;
    border: 1px solid #dbeafe;
    border-radius: 10px;
    padding: 14px;
  }

  .pricing-comparison-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid #f1f5f9;
  }

  .pricing-label {
    font-size: 12px;
    font-weight: 700;
    color: #1e293b;
  }

  .pricing-subtext {
    font-size: 11px;
    color: var(--text-muted);
  }

  .price-savings-pill {
    background: #dcfce7;
    color: #15803d;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 9999px;
    border: 1px solid #bbf7d0;
  }

  .pricing-line-items {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
  }

  .price-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-muted);
  }

  .price-strike {
    text-decoration: line-through;
    color: #94a3b8;
  }

  .price-highlight {
    font-weight: 600;
    color: #1e293b;
  }

  .price-discount-row {
    color: #047857;
    font-weight: 600;
  }

  .price-discount-text {
    color: #047857;
  }

  .price-total-row {
    padding-top: 8px;
    margin-top: 6px;
    border-top: 1.5px solid #e2e8f0;
    font-weight: 700;
    color: #0f172a;
    font-size: 15px;
  }

  .price-total-amount {
    color: #1d4ed8;
    font-size: 18px;
  }

  .btn-submit {
    width: 100%;
    min-height: 50px;
    background: var(--primary);
    color: #ffffff;
    border: none;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
  }

  .btn-submit:hover {
    background: var(--primary-hover);
  }

  .btn-submit:disabled {
    background: #64748b;
    cursor: not-allowed;
  }

  .confirmation-box {
    display: none;
    background: var(--success-bg);
    border: 1.5px solid #86efac;
    padding: 24px;
    border-radius: 12px;
    color: var(--success-text);
    margin-top: 10px;
  }

  .calendar-actions {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .btn-cal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 16px;
    background: #ffffff;
    border: 1px solid #16a34a;
    color: #166534;
    font-weight: 600;
    font-size: 14px;
    border-radius: 8px;
    text-decoration: none;
    min-height: 44px;
    cursor: pointer;
  }
  .btn-cal:hover {
    background: #f0fdf4;
  }

  .status-announcer {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-muted);
  }
</style>
