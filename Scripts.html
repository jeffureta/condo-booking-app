<script>
  /**
   * Client-side Controller for Condominium Booking App.
   * Manages FullCalendar rendering, interactive selection, form validation, and submissions.
   */
  const CALENDAR_ID = '5e250418f97d2008bff93cc10a638b2aabe981af2d5e271b058eb8835dde2ae2@group.calendar.google.com';
  let currentReservation = null;
  let currentBookedRanges = [];
  let fullCalendarInstance = null;
  let isInternalCalendarSync = false;

  function toIso(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  const todayStr = toIso(new Date());

  function bootstrapApp() {
    // Set min date on date inputs to today
    const inInput = document.getElementById('checkInDate');
    const outInput = document.getElementById('checkOutDate');
    if (inInput) inInput.min = todayStr;
    if (outInput) outInput.min = todayStr;

    initFullCalendar();

    announceStatus("Fetching Google Calendar availability...");
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(onBookedRangesLoaded)
        .withFailureHandler(() => {
          onBookedRangesLoaded([]);
        })
        .getBookedRanges();
    } else {
      // Local preview fallback mock
      onBookedRangesLoaded([
        { from: '2026-11-10', to: '2026-11-11', title: 'Existing Reservation' }
      ]);
    }
  }

  // Handle both standard DOM loading and Google Apps Script sandboxed iframe execution
  if (document.readyState === 'interactive' || document.readyState === 'complete') {
    bootstrapApp();
  } else {
    window.addEventListener('DOMContentLoaded', bootstrapApp);
  }

  function initFullCalendar() {
    const calendarEl = document.getElementById('calendarContainer');
    if (!calendarEl) return;

    if (typeof FullCalendar === 'undefined') {
      // Graceful fallback to embedded Google Calendar iframe if external script fails
      const embedUrl = `https://calendar.google.com/calendar/embed?src=${encodeURIComponent(CALENDAR_ID)}&ctz=Asia%2FManila&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=1&mode=MONTH`;
      calendarEl.innerHTML = `<iframe src="${embedUrl}" style="border: 0; width: 100%; height: 420px; border-radius: 8px;" frameborder="0" scrolling="no" title="Google Calendar Availability Schedule" loading="lazy"></iframe>`;
      return;
    }

    fullCalendarInstance = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: ''
      },
      selectable: true,
      selectMirror: true,
      unselectAuto: false,
      selectOverlap: false,
      longPressDelay: 250,
      selectAllow: function(selectInfo) {
        const start = selectInfo.startStr.split('T')[0];
        const end = selectInfo.endStr.split('T')[0];
        if (start < todayStr) return false;
        if (end <= start) return false;
        return !rangeHasConflict(start, end);
      },
      select: function(selectInfo) {
        if (isInternalCalendarSync) return;
        isInternalCalendarSync = true;
        const checkIn = selectInfo.startStr.split('T')[0];
        const checkOut = selectInfo.endStr.split('T')[0];

        const inInput = document.getElementById('checkInDate');
        const outInput = document.getElementById('checkOutDate');
        if (inInput) inInput.value = checkIn;
        if (outInput) {
          outInput.value = checkOut;
          outInput.min = checkIn;
        }

        document.getElementById('statusMessage').textContent = '';
        updateStaySummary(new Date(checkIn + 'T00:00:00'), new Date(checkOut + 'T00:00:00'));
        announceStatus(`Selected check-in: ${checkIn}, check-out: ${checkOut}`);
        isInternalCalendarSync = false;
      },
      events: []
    });

    fullCalendarInstance.render();
  }

  function onBookedRangesLoaded(ranges) {
    currentBookedRanges = ranges || [];
    announceStatus("Google Calendar availability updated.");

    if (fullCalendarInstance) {
      fullCalendarInstance.removeAllEvents();
      currentBookedRanges.forEach(r => {
        fullCalendarInstance.addEvent({
          id: `booking-${r.from}`,
          start: r.from,
          end: r.to,
          title: 'Booked',
          display: 'block',
          overlap: false,
          backgroundColor: '#94a3b8',
          borderColor: '#64748b',
          textColor: '#ffffff',
          classNames: ['fc-booked-event'],
          extendedProps: {
            isBooked: true,
            originalTitle: r.title || 'Reserved'
          }
        });
      });
    }
  }

  function onDateInputChange() {
    const inVal = document.getElementById('checkInDate').value;
    const outVal = document.getElementById('checkOutDate').value;
    const outInput = document.getElementById('checkOutDate');

    if (inVal && outInput) {
      outInput.min = inVal;
    }

    if (inVal && outVal) {
      if (outVal <= inVal) {
        document.getElementById('statusMessage').textContent = "⚠️ Check-out date must be after check-in date.";
        document.getElementById('statusMessage').style.color = "#b91c1c";
        hideStaySummary();
        if (fullCalendarInstance && !isInternalCalendarSync) fullCalendarInstance.unselect();
        return;
      }
      if (rangeHasConflict(inVal, outVal)) {
        document.getElementById('statusMessage').textContent = "⚠️ Selected range overlaps with an existing reservation on Google Calendar.";
        document.getElementById('statusMessage').style.color = "#b91c1c";
        hideStaySummary();
        if (fullCalendarInstance && !isInternalCalendarSync) fullCalendarInstance.unselect();
        return;
      }

      document.getElementById('statusMessage').textContent = "";
      updateStaySummary(new Date(inVal + 'T00:00:00'), new Date(outVal + 'T00:00:00'));
      announceStatus(`Selected check-in: ${inVal}, check-out: ${outVal}`);

      if (fullCalendarInstance && !isInternalCalendarSync) {
        isInternalCalendarSync = true;
        fullCalendarInstance.select(inVal, outVal);
        isInternalCalendarSync = false;
      }
    } else {
      hideStaySummary();
      if (fullCalendarInstance && !isInternalCalendarSync) {
        fullCalendarInstance.unselect();
      }
    }
  }

  function rangeHasConflict(start, end) {
    return currentBookedRanges.some(r => start < r.to && end > r.from);
  }

  function updateStaySummary(startDate, endDate) {
    const card = document.getElementById('staySummaryCard');
    const inEl = document.getElementById('summaryCheckIn');
    const outEl = document.getElementById('summaryCheckOut');
    const nightsEl = document.getElementById('summaryNights');

    const opts = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
    inEl.textContent = startDate.toLocaleDateString(undefined, opts);
    outEl.textContent = endDate.toLocaleDateString(undefined, opts);

    const diffTime = Math.abs(endDate - startDate);
    const nights = Math.round(diffTime / (1000 * 60 * 60 * 24));
    nightsEl.textContent = nights === 1 ? '1 night' : `${nights} nights`;

    card.style.display = 'flex';
  }

  function hideStaySummary() {
    const card = document.getElementById('staySummaryCard');
    if (card) card.style.display = 'none';
  }

  function submitReservation(e) {
    e.preventDefault();
    const statusMsg = document.getElementById('statusMessage');
    statusMsg.textContent = '';

    const checkIn = document.getElementById('checkInDate').value;
    const checkOut = document.getElementById('checkOutDate').value;

    if (!checkIn || !checkOut) {
      statusMsg.textContent = "⚠️ Please select both a check-in and check-out date.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    if (checkOut <= checkIn) {
      statusMsg.textContent = "⚠️ Check-out date must be after check-in date.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    if (rangeHasConflict(checkIn, checkOut)) {
      statusMsg.textContent = "⚠️ Dates conflict with an existing booking. Please pick another date range.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    const name = document.getElementById('guestName').value.trim();
    const email = document.getElementById('guestEmail').value.trim();
    const phone = document.getElementById('guestPhone').value.trim();
    const guestCount = document.getElementById('guestCount').value;

    if (!name || !email || !phone) {
      statusMsg.textContent = "⚠️ Please fill in all required contact details.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    const payload = {
      startDate: checkIn,
      endDate: checkOut,
      guestName: name,
      guestEmail: email,
      guestPhone: phone,
      guestCount: parseInt(guestCount, 10)
    };

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span>Processing reservation...</span>';
    announceStatus("Submitting reservation to Google Calendar...");

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      // Calls createBooking (and processBooking alias is also available on backend)
      google.script.run
        .withSuccessHandler(res => {
          resetSubmitButton();
          if (res.success) {
            handleBookingSuccess(res, payload);
          } else {
            statusMsg.textContent = `⚠️ ${res.message || "Could not complete reservation."}`;
            statusMsg.style.color = "#b91c1c";
          }
        })
        .withFailureHandler(err => {
          resetSubmitButton();
          statusMsg.textContent = `⚠️ Connection error: ${err.message || err}. Please try again.`;
          statusMsg.style.color = "#b91c1c";
        })
        .createBooking(payload);
    } else {
      // Local preview / mock fallback
      setTimeout(() => {
        resetSubmitButton();
        const mockRef = 'LOCAL-' + Math.floor(100000 + Math.random() * 900000);
        handleBookingSuccess({ success: true, referenceId: mockRef }, payload);
      }, 500);
    }
  }

  function handleBookingSuccess(res, data) {
    const ref = res.referenceId || res.refId;
    currentReservation = { ...data, referenceId: ref };

    document.getElementById('bookingForm').style.display = 'none';
    const confBox = document.getElementById('confirmationBox');
    confBox.style.display = 'block';

    document.getElementById('confText').innerHTML = 
      `Thank you, <strong>${escapeHtml(data.guestName)}</strong>! Your reservation for <strong>${escapeHtml(String(data.guestCount))} guest(s)</strong> ` +
      `from <strong>${data.startDate}</strong> to <strong>${data.endDate}</strong> is confirmed.<br><br>` +
      `<strong>Reference ID:</strong> #${ref}<br>` +
      `A confirmation email has been dispatched to <em>${escapeHtml(data.guestEmail)}</em>.<br>` +
      `Your stay has been recorded in our Google Calendar.`;

    setupGoogleCalendarLink(ref);
    announceStatus(`Reservation confirmed! Your reference ID is ${ref}.`);
    confBox.scrollIntoView({ behavior: 'smooth' });
  }

  function resetSubmitButton() {
    const submitBtn = document.getElementById('submitBtn');
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<span>Confirm and Lock in Reservation</span>';
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  function setupGoogleCalendarLink(refId) {
    const inVal = document.getElementById('checkInDate').value;
    const outVal = document.getElementById('checkOutDate').value;
    if (!inVal || !outVal) return;

    const s = inVal.replace(/-/g, '');
    const e = outVal.replace(/-/g, '');
    const title = encodeURIComponent("Stay at 2-Bedroom Condominium (Ref #" + refId + ")");
    const details = encodeURIComponent("Condo Reservation Ref #" + refId + "\nCheck-in: 3:00 PM\nCheck-out: 11:00 AM");
    const loc = encodeURIComponent("418 Serin Tagaytay Condominium");

    const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${s}T150000/${e}T110000&details=${details}&location=${loc}`;
    const btn = document.getElementById('addToGoogleCalBtn');
    if (btn) btn.href = url;
  }

  function downloadIcsFile() {
    if (!currentReservation) return;
    const inVal = currentReservation.startDate.replace(/-/g, '');
    const outVal = currentReservation.endDate.replace(/-/g, '');
    const ref = currentReservation.referenceId;

    const icsContent = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//Condo Booking//EN",
      "BEGIN:VEVENT",
      `UID:condo-${ref}@booking.local`,
      `DTSTAMP:${toIso(new Date()).replace(/-/g, '')}T000000Z`,
      `DTSTART:${inVal}T150000`,
      `DTEND:${outVal}T110000`,
      `SUMMARY:Stay at 2-Bedroom Condominium (Ref #${ref})`,
      `DESCRIPTION:Condominium Reservation Ref #${ref}\\nGuest: ${currentReservation.guestName}\\nGuests: ${currentReservation.guestCount}`,
      `LOCATION:418 Serin Tagaytay Condominium`,
      "STATUS:CONFIRMED",
      "END:VEVENT",
      "END:VCALENDAR"
    ].join("\r\n");

    const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
    const link = document.createElement('a');
    link.href = window.URL.createObjectURL(blob);
    link.setAttribute('download', `condo-booking-${ref}.ics`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function announceStatus(msg) {
    const sr = document.getElementById('srAnnouncement');
    if (sr) sr.textContent = msg;
  }
</script>
