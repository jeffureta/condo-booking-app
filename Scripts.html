  function toIso(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1);
    if (m.length < 2) m = '0' + m;
    var day = String(d.getDate());
    if (day.length < 2) day = '0' + day;
    return y + '-' + m + '-' + day;
  }

  function getSeasonForDate(dateStr) {
    var month = parseInt(dateStr.slice(5, 7), 10);
    if (month === 12 || month === 1 || month === 2) {
      return {
        code: 'AMIHAN_COOL',
        icon: '❄️',
        label: 'Cool Amihan Season (17–24°C)',
        desc: 'Crisp breezes & clear Taal views. Peak staycation season.',
        weekdayMult: 1.10,
        weekendMult: 1.10
      };
    }
    if (month >= 3 && month <= 5) {
      return {
        code: 'SUMMER_ESCAPE',
        icon: '☀️',
        label: 'Summer Ridge Escape',
        desc: 'Sunny mountain breeze escaping Manila heat.',
        weekdayMult: 1.05,
        weekendMult: 1.05
      };
    }
    if (month === 11) {
      return {
        code: 'BER_SHOULDER',
        icon: '🌤️',
        label: 'Ber-Months Shoulder Season',
        desc: 'Cooling weather leading into December holidays.',
        weekdayMult: 1.00,
        weekendMult: 1.00
      };
    }
    return {
      code: 'HABAGAT_RAINY',
      icon: '🌧️',
      label: 'Habagat Cozy Rainy Season',
      desc: 'Misty fog & quiet indoor staycation discounts.',
      weekdayMult: 0.90,
      weekendMult: 0.95
    };
  }

  function getHolidayOrEvent(dateStr) {
    if (PH_HOLIDAYS_AND_EVENTS[dateStr]) {
      return PH_HOLIDAYS_AND_EVENTS[dateStr];
    }
    var mmDd = dateStr.slice(5, 10);
    if (PH_HOLIDAYS_AND_EVENTS[mmDd]) {
      return PH_HOLIDAYS_AND_EVENTS[mmDd];
    }
    return null;
  }

  function calculateNightlyPrice(dateStr) {
    var holiday = getHolidayOrEvent(dateStr);
    var season = getSeasonForDate(dateStr);
    var dObj = new Date(dateStr + 'T00:00:00');
    var dayOfWeek = dObj.getDay();
    var isWeekend = dayOfWeek === 0 || dayOfWeek === 5 || dayOfWeek === 6;

    var tier = 'WEEKDAY';
    var tierLabel = 'Weekday';

    if (holiday) {
      tier = 'PEAK';
      tierLabel = holiday;
    } else if (isWeekend) {
      tier = 'WEEKEND';
      tierLabel = 'Weekend';
    }

    var baseOnlineAvg = (typeof window !== 'undefined' && window.ONLINE_AVERAGE_MARKET_RATE)
      ? window.ONLINE_AVERAGE_MARKET_RATE
      : ONLINE_AVERAGE_MARKET_RATE;

    var marketRate = Math.round(baseOnlineAvg);
    var unitRate = marketRate - COMPETITOR_UNDERCUT_PHP; // Guaranteed -₱500/night savings

    return {
      dateStr: dateStr,
      tier: tier,
      tierLabel: tierLabel,
      season: season,
      marketRate: marketRate,
      unitRate: unitRate,
      savings: COMPETITOR_UNDERCUT_PHP
    };
  }

  function calculateStayQuote(checkInStr, checkOutStr, guestCount) {
    if (!checkInStr || !checkOutStr || checkOutStr <= checkInStr) return null;

    var inDate = new Date(checkInStr + 'T00:00:00');
    var outDate = new Date(checkOutStr + 'T00:00:00');
    var diffMs = outDate.getTime() - inDate.getTime();
    var nights = Math.max(0, Math.round(diffMs / (1000 * 60 * 60 * 24)));
    if (nights === 0) return null;

    var guests = Math.min(6, Math.max(1, parseInt(guestCount, 10) || 2));
    var extraGuests = Math.max(0, guests - 4);

    var marketSubtotal = 0;
    var baseUnitSubtotal = 0;
    var nightlyList = [];

    for (var i = 0; i < nights; i++) {
      var cur = new Date(inDate.getTime() + i * (24 * 60 * 60 * 1000));
      var iso = toIso(cur);
      var nInfo = calculateNightlyPrice(iso);
      nightlyList.push(nInfo);
      marketSubtotal += nInfo.marketRate;
      baseUnitSubtotal += nInfo.unitRate;
    }

    var discountRate = 0;
    var discountLabel = '';
    if (nights >= 7) {
      discountRate = 0.10;
      discountLabel = 'Weekly Staycation (10% Off)';
    } else if (nights >= 3) {
      discountRate = 0.05;
      discountLabel = 'Extended Staycation (5% Off)';
    }

    var discountAmount = Math.round(baseUnitSubtotal * discountRate);
    var extraGuestFee = extraGuests * 400 * nights;
    var totalPrice = baseUnitSubtotal - discountAmount + extraGuestFee;
    var competitorSavings = 500 * nights;
    var totalSavings = competitorSavings + discountAmount;

    return {
      checkIn: checkInStr,
      checkOut: checkOutStr,
      nights: nights,
      guestCount: guests,
      extraGuests: extraGuests,
      marketSubtotal: marketSubtotal,
      baseUnitSubtotal: baseUnitSubtotal,
      competitorSavings: competitorSavings,
      discountRate: discountRate,
      discountLabel: discountLabel,
      discountAmount: discountAmount,
      extraGuestFee: extraGuestFee,
      totalPrice: totalPrice,
      totalSavings: totalSavings,
      averageNightly: Math.round(totalPrice / nights),
      nightlyList: nightlyList
    };
  }

  function formatPhp(amount) {
    return '₱' + Math.round(amount).toLocaleString('en-US');
  }

  function formatCompactPhp(amount) {
    var num = Math.round(amount);
    if (num >= 1000) {
      var k = Math.round((num / 1000) * 10) / 10;
      return '₱' + k + 'k';
    }
    return '₱' + num;
  }

  /* ==========================================================================
     APP LIFECYCLE & AVAILABILITY
     ========================================================================== */
  function bootstrapApp() {
    var inInput = document.getElementById('checkInDate');
    var outInput = document.getElementById('checkOutDate');
    if (inInput) inInput.min = todayStr;
    if (outInput) outInput.min = todayStr;

    initCustomCalendar();
    fetchBookedRanges();
  }

  function fetchBookedRanges() {
    hideCalendarError();
    announceStatus("Fetching Google Calendar availability...");
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(onBookedRangesLoaded)
        .withFailureHandler(onBookedRangesError)
        .getBookedRanges();
    } else {
      // Local preview fallback mock
      onBookedRangesLoaded([
        { from: '2026-11-18', to: '2026-11-20', title: 'Reserved Guest' }
      ]);
    }
  }

  function retryFetchAvailability() {
    var retryBtn = document.getElementById('calendarRetryBtn');
    if (retryBtn) {
      retryBtn.disabled = true;
      retryBtn.textContent = 'Retrying...';
    }
    fetchBookedRanges();
  }

  function showCalendarError(err) {
    console.error('[CondoCalendar] Failed to load calendar availability:', err);
    var banner = document.getElementById('calendarErrorBanner');
    var msgEl = document.getElementById('calendarErrorMessage');
    var retryBtn = document.getElementById('calendarRetryBtn');

    if (banner && msgEl) {
      var detail = err && (err.message || (typeof err === 'string' ? err : ''));
      msgEl.textContent = detail 
        ? 'Unable to load dates: ' + detail + '. Please check your connection and retry.'
        : 'Unable to load dates from Google Calendar. Please click Retry.';
      banner.style.display = 'flex';
    }
    if (retryBtn) {
      retryBtn.disabled = false;
      retryBtn.textContent = 'Retry';
    }
    announceStatus("Failed to load Google Calendar availability.");
  }

  function hideCalendarError() {
    var banner = document.getElementById('calendarErrorBanner');
    if (banner) {
      banner.style.display = 'none';
    }
    var retryBtn = document.getElementById('calendarRetryBtn');
    if (retryBtn) {
      retryBtn.disabled = false;
      retryBtn.textContent = 'Retry';
    }
  }

  function onBookedRangesError(err) {
    showCalendarError(err);
    onBookedRangesLoaded([]);
  }

  if (document.readyState === 'interactive' || document.readyState === 'complete') {
    bootstrapApp();
  } else {
    window.addEventListener('DOMContentLoaded', bootstrapApp);
  }

  /* ==========================================================================
     CUSTOM CALENDAR GRID RENDERING & SELECTION CONTROLLER
     ========================================================================== */
  function initCustomCalendar() {
    var prevBtn = document.getElementById('calPrevBtn');
    var nextBtn = document.getElementById('calNextBtn');

    if (prevBtn) {
      prevBtn.addEventListener('click', function() {
        currentDisplayDate.setMonth(currentDisplayDate.getMonth() - 1);
        renderCalendar();
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', function() {
        currentDisplayDate.setMonth(currentDisplayDate.getMonth() + 1);
        renderCalendar();
      });
    }

    window.addEventListener('mouseup', function() {
      if (isDragging) {
        finalizeSelection();
      }
    });

    renderCalendar();
  }

  function renderCalendar() {
    try {
      var gridEl = document.getElementById('customCalendarGrid');
      var titleEl = document.getElementById('calMonthTitle');
      if (!gridEl || !titleEl) return;

      var year = currentDisplayDate.getFullYear();
      var month = currentDisplayDate.getMonth();

      var monthName = currentDisplayDate.toLocaleString('default', { month: 'long' });
      titleEl.textContent = monthName + ' ' + year;

      // Update Season Indicator Banner
      updateSeasonBanner(currentDisplayDate);

      gridEl.innerHTML = '';

      var firstDay = new Date(year, month, 1);
      var startDayOfWeek = firstDay.getDay();
      var startDate = new Date(year, month, 1 - startDayOfWeek);

      var inVal = document.getElementById('checkInDate').value;
      var outVal = document.getElementById('checkOutDate').value;

      for (var i = 0; i < 42; i++) {
        var cellDate = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate() + i);
        var iso = toIso(cellDate);
        var dayNum = cellDate.getDate();
        var isCurrentMonth = cellDate.getMonth() === month;

        var priceInfo = calculateNightlyPrice(iso);

        var cell = document.createElement('div');
        cell.className = 'cal-cell';
        cell.dataset.date = iso;
        cell.setAttribute('role', 'gridcell');
        cell.setAttribute('tabindex', '0');

        if (priceInfo.tier === 'PEAK') {
          cell.classList.add('cal-peak-date');
        }

        var labelText = iso + ': ' + formatPhp(priceInfo.unitRate) + ' / night (' + priceInfo.tierLabel + ', ' + priceInfo.season.label + ')';
        cell.setAttribute('aria-label', labelText);
        cell.setAttribute('title', labelText);

        var daySpan = document.createElement('span');
        daySpan.className = 'cal-cell-day';
        daySpan.textContent = dayNum;
        cell.appendChild(daySpan);

        var subSpan = document.createElement('span');
        subSpan.className = 'cal-cell-sub';
        cell.appendChild(subSpan);

        if (!isCurrentMonth) {
          cell.classList.add('cal-other-month');
        }

        if (iso === todayStr) {
          cell.classList.add('cal-today');
        }

        if (iso < todayStr) {
          cell.classList.add('cal-disabled');
          cell.setAttribute('aria-disabled', 'true');
        }

        var isOccupied = currentBookedRanges.some(function(r) {
          return iso >= r.from && iso < r.to;
        });
        if (isOccupied) {
          cell.classList.add('cal-booked');
          cell.setAttribute('aria-disabled', 'true');
          subSpan.textContent = 'Booked';
        } else if (iso >= todayStr) {
          subSpan.textContent = formatCompactPhp(priceInfo.unitRate);
        }

        applyCellSelectionClasses(cell, iso, inVal, outVal);
        attachCellEvents(cell, iso);

        gridEl.appendChild(cell);
      }
    } catch (err) {
      console.error('[CondoCalendar] Error rendering calendar grid:', err);
      showCalendarError(err);
    }
  }

  function updateSeasonBanner(d) {
    var iso = toIso(d);
    var season = getSeasonForDate(iso);
    var iconEl = document.getElementById('calendarSeasonIcon');
    var titleEl = document.getElementById('calendarSeasonTitle');
    var descEl = document.getElementById('calendarSeasonDesc');

    if (iconEl) iconEl.textContent = season.icon;
    if (titleEl) titleEl.textContent = season.label + ' • Unit 418 Dynamic Rate';
    if (descEl) descEl.textContent = season.desc;
  }

  function applyCellSelectionClasses(cell, iso, inVal, outVal) {
    var activeStart = inVal;
    var activeEnd = outVal;

    if (isDragging && selectionAnchor && selectionHover) {
      if (selectionAnchor <= selectionHover) {
        activeStart = selectionAnchor;
        activeEnd = selectionHover;
      } else {
        activeStart = selectionHover;
        activeEnd = selectionAnchor;
      }
    }

    if (activeStart && activeEnd && activeStart !== activeEnd) {
      if (iso === activeStart) {
        cell.classList.add('cal-selected-start');
      } else if (iso === activeEnd) {
        cell.classList.add('cal-selected-end');
      } else if (iso > activeStart && iso < activeEnd) {
        cell.classList.add('cal-in-range');
      }
    } else if (activeStart && (!activeEnd || activeStart === activeEnd)) {
      if (iso === activeStart) {
        cell.classList.add('cal-selected-single');
      }
    }
  }

  function attachCellEvents(cell, iso) {
    var isPast = iso < todayStr;
    var isOccupied = currentBookedRanges.some(function(r) {
      return iso >= r.from && iso < r.to;
    });

    cell.addEventListener('click', function(e) {
      if (isPast || isOccupied) return;
      handleCellClick(iso);
    });

    cell.addEventListener('mousedown', function(e) {
      if (typeof e.button === 'number' && e.button !== 0) return;
      if (isPast || isOccupied) return;

      isDragging = true;
      selectionAnchor = iso;
      selectionHover = iso;
      highlightPreviewRange(selectionAnchor, selectionHover);
    });

    cell.addEventListener('mouseenter', function() {
      if (!isDragging || !selectionAnchor) return;
      selectionHover = iso;
      highlightPreviewRange(selectionAnchor, selectionHover);
    });

    cell.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (isPast || isOccupied) return;
        handleCellClick(iso);
      }
    });
  }

  function highlightPreviewRange(anchor, hover) {
    if (!anchor || !hover) return;
    var start = anchor <= hover ? anchor : hover;
    var end = anchor <= hover ? hover : anchor;

    var allCells = document.querySelectorAll('.cal-cell');
    allCells.forEach(function(c) {
      var d = c.dataset.date;
      c.classList.remove('cal-selected-start', 'cal-selected-end', 'cal-in-range', 'cal-selected-single');
      if (start === end) {
        if (d === start) c.classList.add('cal-selected-single');
      } else {
        if (d === start) c.classList.add('cal-selected-start');
        else if (d === end) c.classList.add('cal-selected-end');
        else if (d > start && d < end) c.classList.add('cal-in-range');
      }
    });
  }

  function finalizeSelection() {
    isDragging = false;
    if (!selectionAnchor || !selectionHover) return;

    var checkIn = selectionAnchor <= selectionHover ? selectionAnchor : selectionHover;
    var checkOut = selectionAnchor <= selectionHover ? selectionHover : selectionAnchor;

    if (checkIn === checkOut) {
      handleCellClick(checkIn);
      return;
    }

    applyConfirmedDateRange(checkIn, checkOut);
    selectionAnchor = null;
    selectionHover = null;
  }

  function handleCellClick(iso) {
    var inInput = document.getElementById('checkInDate');
    var outInput = document.getElementById('checkOutDate');

    if (!inInput.value || (inInput.value && outInput.value)) {
      inInput.value = iso;
      outInput.value = '';
      outInput.min = iso;
      hideStaySummary();
      renderCalendar();
      announceStatus('Selected check-in date: ' + iso + '. Now select check-out date.');
    } else {
      var existingIn = inInput.value;
      if (iso <= existingIn) {
        inInput.value = iso;
        outInput.value = '';
        outInput.min = iso;
        hideStaySummary();
        renderCalendar();
        announceStatus('Updated check-in date: ' + iso + '. Now select check-out date.');
      } else {
        applyConfirmedDateRange(existingIn, iso);
      }
    }
  }

  function applyConfirmedDateRange(checkIn, checkOut) {
    var statusMsg = document.getElementById('statusMessage');
    var inInput = document.getElementById('checkInDate');
    var outInput = document.getElementById('checkOutDate');

    if (checkIn < todayStr) {
      statusMsg.textContent = "⚠️ Check-in date cannot be in the past.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    if (rangeHasConflict(checkIn, checkOut)) {
      statusMsg.textContent = "⚠️ The selected date range overlaps with an existing reservation. Please select available dates.";
      statusMsg.style.color = "#b91c1c";
      renderCalendar();
      return;
    }

    statusMsg.textContent = '';
    isInternalCalendarSync = true;
    inInput.value = checkIn;
    outInput.value = checkOut;
    outInput.min = checkIn;
    isInternalCalendarSync = false;

    updateStaySummary();
    announceStatus('Selected check-in: ' + checkIn + ', check-out: ' + checkOut);
    renderCalendar();
  }

  function onBookedRangesLoaded(ranges) {
    hideCalendarError();
    currentBookedRanges = ranges || [];
    announceStatus("Google Calendar availability updated.");
    renderCalendar();
  }

  function onDateInputChange() {
    var inVal = document.getElementById('checkInDate').value;
    var outVal = document.getElementById('checkOutDate').value;
    var outInput = document.getElementById('checkOutDate');

    if (inVal && outInput) {
      outInput.min = inVal;
    }

    if (inVal && outVal) {
      if (outVal <= inVal) {
        document.getElementById('statusMessage').textContent = "⚠️ Check-out date must be after check-in date.";
        document.getElementById('statusMessage').style.color = "#b91c1c";
        hideStaySummary();
        renderCalendar();
        return;
      }
      if (rangeHasConflict(inVal, outVal)) {
        document.getElementById('statusMessage').textContent = "⚠️ Selected range overlaps with an existing reservation on Google Calendar.";
        document.getElementById('statusMessage').style.color = "#b91c1c";
        hideStaySummary();
        renderCalendar();
        return;
      }

      document.getElementById('statusMessage').textContent = "";
      updateStaySummary();
      announceStatus('Selected check-in: ' + inVal + ', check-out: ' + outVal);
      renderCalendar();
    } else {
      hideStaySummary();
      renderCalendar();
    }
  }

  function onGuestCountChange() {
    var inVal = document.getElementById('checkInDate').value;
    var outVal = document.getElementById('checkOutDate').value;
    if (inVal && outVal && outVal > inVal) {
      updateStaySummary();
    }
  }

  function rangeHasConflict(start, end) {
    return currentBookedRanges.some(function(r) {
      return start < r.to && end > r.from;
    });
  }

  function updateStaySummary() {
    var inVal = document.getElementById('checkInDate').value;
    var outVal = document.getElementById('checkOutDate').value;
    var guestCount = document.getElementById('guestCount').value;
    var card = document.getElementById('staySummaryCard');

    if (!inVal || !outVal || outVal <= inVal || !card) {
      hideStaySummary();
      return;
    }

    var quote = calculateStayQuote(inVal, outVal, guestCount);
    currentStayQuote = quote;
    if (!quote) {
      hideStaySummary();
      return;
    }

    var startDate = new Date(inVal + 'T00:00:00');
    var endDate = new Date(outVal + 'T00:00:00');
    var opts = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };

    var inEl = document.getElementById('summaryCheckIn');
    var outEl = document.getElementById('summaryCheckOut');
    var nightsEl = document.getElementById('summaryNights');

    if (inEl) inEl.textContent = startDate.toLocaleDateString(undefined, opts);
    if (outEl) outEl.textContent = endDate.toLocaleDateString(undefined, opts);
    if (nightsEl) nightsEl.textContent = quote.nights === 1 ? '1 night' : (quote.nights + ' nights');

    // Populate Pricing Breakdown Card
    var marketEl = document.getElementById('summaryMarketSubtotal');
    var unitEl = document.getElementById('summaryUnitSubtotal');

  function submitReservation(e) {
    e.preventDefault();
    var statusMsg = document.getElementById('statusMessage');
    statusMsg.textContent = '';

    var checkIn = document.getElementById('checkInDate').value;
    var checkOut = document.getElementById('checkOutDate').value;

    if (!checkIn || !checkOut) {
      statusMsg.textContent = "⚠️ Please select both a check-in and check-out date.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    if (checkOut <= checkIn) {
      statusMsg.textContent = "⚠️ Check-out date must be after check-in date.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    if (rangeHasConflict(checkIn, checkOut)) {
      statusMsg.textContent = "⚠️ Dates conflict with an existing booking. Please pick another date range.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    var name = document.getElementById('guestName').value.trim();
    var email = document.getElementById('guestEmail').value.trim();
    var phone = document.getElementById('guestPhone').value.trim();
    var guestCount = document.getElementById('guestCount').value;

    if (!name || !email || !phone) {
      statusMsg.textContent = "⚠️ Please fill in all required contact details.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    var payload = {
      startDate: checkIn,
      endDate: checkOut,
      guestName: name,
      guestEmail: email,
      guestPhone: phone,
      guestCount: parseInt(guestCount, 10),
      clientQuote: currentStayQuote
    };

    var submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span>Processing reservation...</span>';
    announceStatus("Submitting staycation reservation...");

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          resetSubmitButton();
          if (res.success) {
            handleBookingSuccess(res, payload);
          } else {
            statusMsg.textContent = '⚠️ ' + (res.message || "Could not complete reservation.");
            statusMsg.style.color = "#b91c1c";
          }
        })
        .withFailureHandler(function(err) {
          resetSubmitButton();
          statusMsg.textContent = '⚠️ Connection error: ' + (err.message || err) + '. Please try again.';
          statusMsg.style.color = "#b91c1c";
        })
        .createBooking(payload);
    } else {
      // Local preview / mock fallback
      setTimeout(function() {
        resetSubmitButton();
        var mockRef = 'CND-' + Math.floor(1000 + Math.random() * 9000);
        var mockQuote = calculateStayQuote(payload.startDate, payload.endDate, payload.guestCount);
        handleBookingSuccess({
          success: true,
          referenceId: mockRef,
          totalPrice: mockQuote ? mockQuote.totalPrice : null,
          pricing: mockQuote
        }, payload);
      }, 500);
    }
  }

    var totalAmount = quote ? quote.totalPrice : (res.totalPrice || null);

    var title = encodeURIComponent("Staycation: Unit 418 Serin East Tagaytay (Ref #" + refId + ")");

    if (!currentReservation) return;

    var outVal = currentReservation.endDate.replace(/-/g, '');
    var ref = currentReservation.referenceId;
    var slashSlash = '/' + '/';

    var icsContent = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-" + slashSlash + "Condo Booking" + slashSlash + "EN",
      "BEGIN:VEVENT",

  function analyzeLanguageStatistics(text) {
    if (!text) {
      return {
        language: 'en',
        probabilities: { en: 0.8, tl: 0.1, taglish: 0.1 },
        codeMixingIndex: 0,
        politenessScore: 0,
        register: 'warm'
      };
    }

    var clean = text.toLowerCase().trim();
    var tokens = clean.split(/[^a-zA-Z0-9_\u00C0-\u024F-]+/).filter(Boolean);

    var tlTokens = 0;
    var enTokens = 0;
    var politeHits = 0;

    var morphCodeSwitch = /\b(mag-[a-z]+|nag-[a-z]+|i-[a-z]+|allowed\s+ba|pwede\s+ba\s+mag|pwede\s+mag)\b/i.test(clean);

    for (var i = 0; i < tokens.length; i++) {
      var tok = tokens[i];
      if (NEUTRAL_LOANWORDS.indexOf(tok) !== -1) continue;

      if (TAGALOG_MARKERS.indexOf(tok) !== -1) {
        tlTokens++;
      } else if (ENGLISH_MARKERS.indexOf(tok) !== -1) {
        enTokens++;
      } else if (tok.indexOf('mag') === 0 || tok.indexOf('nag') === 0) {
        tlTokens += 0.8;
      }
    }

    for (var p = 0; p < POLITE_MARKERS.length; p++) {
      if (clean.indexOf(POLITE_MARKERS[p]) !== -1) {
        politeHits++;
      }
    }

    var politenessScore = tokens.length > 0 ? (politeHits / Math.min(tokens.length, 6)) : 0;
    var register = politenessScore >= 0.15 ? 'polite' : 'warm';

    var totalAnalyzed = tlTokens + enTokens;
    var cmi = 0;
    if (totalAnalyzed > 0) {
      var maxLang = Math.max(tlTokens, enTokens);
      cmi = 1 - (maxLang / totalAnalyzed);
    }

    var language = 'en';
    var isTaglish = morphCodeSwitch || (cmi >= 0.22 && tlTokens >= 0.8 && enTokens >= 0.8);

    if (isTaglish) {
      language = 'taglish';
    } else if (tlTokens > enTokens || (tlTokens >= 1 && enTokens === 0)) {
      language = 'tl';
    } else {
      language = 'en';
    }

    return {
      language: language,
      probabilities: {
        en: language === 'en' ? 0.8 : (language === 'taglish' ? 0.15 : 0.1),
        tl: language === 'tl' ? 0.75 : (language === 'taglish' ? 0.15 : 0.1),
        taglish: language === 'taglish' ? 0.7 : 0.15
      },
      codeMixingIndex: Math.round(cmi * 1000) / 1000,
      politenessScore: Math.round(politenessScore * 1000) / 1000,
      register: register
    };
  }

  function getTrigrams(str) {
    var trigrams = [];
    var padded = '  ' + str + ' ';
    for (var i = 0; i < padded.length - 2; i++) {
      var tri = padded.slice(i, i + 3);
      if (trigrams.indexOf(tri) === -1) trigrams.push(tri);
    }
    return trigrams;
  }

  function trigramDiceSimilarity(str1, str2) {
    if (str1 === str2) return 1.0;
    if (!str1 || !str2) return 0;
    var tri1 = getTrigrams(str1);
    var tri2 = getTrigrams(str2);
    var intersection = 0;
    for (var i = 0; i < tri1.length; i++) {
      if (tri2.indexOf(tri1[i]) !== -1) intersection++;
    }
    return (2 * intersection) / (tri1.length + tri2.length);
  }

  function scoreKnowledgeBaseIntents(text) {
    if (!text) return { ranked: [], confidence: 0 };
    var clean = text.toLowerCase().trim();
    var tokens = clean.split(/[^a-zA-Z0-9_\u00C0-\u024F]+/).filter(function(t) { return t.length > 1; });

    var topicScores = [];
    var keys = Object.keys(KNOWLEDGE_BASE_LAYER);

    for (var i = 0; i < keys.length; i++) {
      var item = KNOWLEDGE_BASE_LAYER[keys[i]];
      var score = 0;
      var matchedKeywords = [];

      for (var t = 0; t < tokens.length; t++) {
        var token = tokens[t];
        for (var k = 0; k < item.keywords.length; k++) {
          var kw = item.keywords[k];
          if (token === kw) {
            score += 3.0;
            matchedKeywords.push(kw);
            break;
          } else if (token.length >= 4 && kw.length >= 4) {
            var sim = trigramDiceSimilarity(token, kw);
            if (sim >= 0.72) {
              score += 2.0 * sim;
              matchedKeywords.push(kw);
              break;
            }
          }
        }
      }

      if (score > 0) {
        topicScores.push({
          id: item.id,
          title: item.title,
          score: score,
          matchedKeywords: matchedKeywords
        });
      }
    }

    topicScores.sort(function(a, b) { return b.score - a.score; });
    var topScore = topicScores.length > 0 ? topicScores[0].score : 0;
    var confidence = topScore >= 3.0 ? Math.min(1.0, topScore / 6.0) : (topScore > 0 ? 0.3 : 0);

    return {
      ranked: topicScores,
      confidence: Math.round(confidence * 1000) / 1000
    };
  }

  function extractBookingEntities(text) {
    if (!text) return { startDate: null, endDate: null, guestCount: null };
    var startDate = null;
    var endDate = null;
    var guestCount = null;

    var isoDates = text.match(/\b\d{4}-\d{2}-\d{2}\b/g);
    if (isoDates && isoDates.length >= 2) {
      startDate = isoDates[0];
      endDate = isoDates[1];
    } else if (isoDates && isoDates.length === 1) {
      startDate = isoDates[0];
    }

    var guestMatch = text.match(/\b(\d+)\s*(guests?|pax|persons?|people|tao|katao)\b/i) ||
                     text.match(/\bfor\s*(\d+)\b/i);
    if (guestMatch) {
      guestCount = parseInt(guestMatch[1], 10);
    }

    return {
      startDate: startDate,
      endDate: endDate,
      guestCount: guestCount
    };
  }

  function resolveGuestAgentReply(userMessage) {
    var stats = analyzeLanguageStatistics(userMessage);
    var language = stats.language;
    var register = stats.register;
    var entities = extractBookingEntities(userMessage);
    var intentAnalysis = scoreKnowledgeBaseIntents(userMessage);
    var rankedIntents = intentAnalysis.ranked;

    var topics = [];
    var textSections = [];
    var hasQuote = false;
    var bookingAction = null;

    if (entities.startDate && entities.endDate) {
      var isConflict = currentBookedRanges.some(function(r) {
        return entities.startDate < r.to && entities.endDate > r.from;
      });

      if (isConflict) {
        topics.push('availability_conflict');
        var conflictMsgs = {
          en: 'Sorry, the dates from ' + entities.startDate + ' to ' + entities.endDate + ' are not available due to an existing booking. Please pick another date range on the calendar!',
          tl: 'Paumanhin po, may nakareserba na sa petsang ' + entities.startDate + ' hanggang ' + entities.endDate + '. Maaari po kayong pumili ng ibang available na araw sa kalendaryo!',
          taglish: 'Sorry po, occupied na ang ' + entities.startDate + ' to ' + entities.endDate + ' on our calendar. Please select other dates po!'
        };
        textSections.push(conflictMsgs[language] || conflictMsgs.en);
      } else {
        var guestCount = entities.guestCount || 2;
        var quote = calculateStayQuote(entities.startDate, entities.endDate, guestCount);

        if (quote) {
          topics.push('booking_quote');
          hasQuote = true;
          bookingAction = {
            startDate: entities.startDate,
            endDate: entities.endDate,
            guestCount: guestCount,
            totalPrice: quote.totalPrice,
            quote: quote
          };

          var savings = quote.totalSavingsVsMarket || quote.totalSavings || 0;
          var availMsgs = {
            en: 'Great news! Unit 418 is available from ' + entities.startDate + ' to ' + entities.endDate + ' (' + quote.nights + ' nights) for ' + guestCount + ' guest(s). Confirmed total is ' + formatPhp(quote.totalPrice) + ' (saving ' + formatPhp(savings) + ' vs market).',
            tl: 'Magandang balita! Available ang Unit 418 mula ' + entities.startDate + ' hanggang ' + entities.endDate + ' (' + quote.nights + ' gabi) para sa ' + guestCount + ' bisita. Ang kabuuang bayad ay ' + formatPhp(quote.totalPrice) + ' (nakatipid ng ' + formatPhp(savings) + ').',
            taglish: 'Available po ang Unit 418 from ' + entities.startDate + ' to ' + entities.endDate + ' (' + quote.nights + ' nights) for ' + guestCount + ' guests! Total is ' + formatPhp(quote.totalPrice) + ' with ' + formatPhp(savings) + ' total savings vs 10km market.'
          };
          textSections.push(availMsgs[language] || availMsgs.en);
        }
      }
    }

    var maxFaqIntents = 2;
    var selectedFaqItems = [];
    for (var f = 0; f < rankedIntents.length; f++) {
      if (selectedFaqItems.length >= maxFaqIntents) break;
      var kbItem = KNOWLEDGE_BASE_LAYER[rankedIntents[f].id];
      if (kbItem) {
        selectedFaqItems.push(kbItem);
        topics.push(rankedIntents[f].id);
      }
    }

    if (selectedFaqItems.length > 0) {
      var connectors = {
        en: ' Additionally, ',
        tl: ' Bukod pa rito, ',
        taglish: ' Also po, '
      };

      var faqTexts = [];
      for (var s = 0; s < selectedFaqItems.length; s++) {
        var it = selectedFaqItems[s];
        var langResponses = it.responses[language] || it.responses.en;
        if (typeof langResponses === 'object') {
          faqTexts.push(langResponses[register] || langResponses.warm || Object.values(langResponses)[0]);
        } else {
          faqTexts.push(langResponses);
        }
      }

      var conn = connectors[language] || connectors.en;
      if (textSections.length > 0) {
        textSections.push(conn + faqTexts.join(conn));
      } else {
        textSections.push(faqTexts.join(conn));
      }
    }

    if (textSections.length === 0) {
      topics.push('general_help');
      var defaultReplies = {
        en: 'Hello! I am your Unit 418 Serin East Tagaytay AI concierge. You can ask me about house rules (e.g. "are dogs allowed?", "can we cook?"), amenities, check-in times, or check date availability!',
        tl: 'Kumusta po! Ako ang inyong Unit 418 Serin East Tagaytay AI concierge. Maaari ninyong itanong ang tungkol sa house rules (hal. "pwede ba ang aso?", "maaari bang magluto?"), amenities, o mag-check ng bakanteng petsa!',
        taglish: 'Hi po! I am your Unit 418 Serin East Tagaytay AI concierge. Feel free to ask about house rules ("allowed ba dogs?", "pwede ba mag-cook?"), amenities, or check available dates!'
      };
      textSections.push(defaultReplies[language] || defaultReplies.en);
    }

    return {
      topic: topics[0] || 'general_help',
      topics: topics,
      language: language,
      text: textSections.join(' ').trim(),
      hasQuote: hasQuote,
      bookingAction: bookingAction,
      stats: {
        language: stats.language,
        probabilities: stats.probabilities,
        codeMixingIndex: stats.codeMixingIndex,
        politenessScore: stats.politenessScore,
        register: stats.register,
        confidence: intentAnalysis.confidence,
        intentScores: rankedIntents
      }
    };
  }

  function toggleAiChatDrawer(forcedState) {
    var drawer = document.getElementById('aiChatDrawer');
    var launcher = document.getElementById('aiChatLauncher');
    if (!drawer) return;

    var isOpen = drawer.style.display !== 'none';
    var nextState = typeof forcedState === 'boolean' ? forcedState : !isOpen;

    drawer.style.display = nextState ? 'flex' : 'none';
    if (launcher) {
      launcher.setAttribute('aria-expanded', nextState ? 'true' : 'false');
    }

    var isMobileViewport = typeof window !== 'undefined' && window.innerWidth && window.innerWidth <= 480;

    if (nextState) {
      if (isMobileViewport && document.body && document.body.style) {
        document.body.style.overflow = 'hidden';
      }
      var input = document.getElementById('aiChatInput');
      // Do not auto-focus on mobile to keep quick-chips visible without virtual keyboard pop-up
      if (input && !isMobileViewport) {
        input.focus();
      }
    } else {
      if (document.body && document.body.style) {
        document.body.style.overflow = '';
      }
    }
  }

  function sendQuickQuestion(questionText) {
    var input = document.getElementById('aiChatInput');
    if (input) {
      input.value = questionText;
      handleAiChatSubmit(null);
    }
  }

  function handleAiChatSubmit(e) {
    if (e && e.preventDefault) e.preventDefault();
    var input = document.getElementById('aiChatInput');
    var messagesEl = document.getElementById('aiChatMessages');
    if (!input || !messagesEl) return;

    var text = input.value.trim();
    if (!text) return;

    appendChatMessage(text, 'user');
    input.value = '';

    // Check Chrome Gemini Nano Prompt API or Fallback
    var fallback = resolveGuestAgentReply(text);

    if (typeof window !== 'undefined' && window.ai && window.ai.languageModel) {
      try {
        window.ai.languageModel.capabilities().then(function(caps) {
          if (caps && caps.available !== 'no') {
            var sysPrompt = 'You are the friendly concierge for Unit 418 Serin East Tagaytay. ' +
              'Facts: Dogs/pets allowed with diaper/carrier upon coordination. Light cooking allowed with induction stove/microwave/cookware, no smelly frying. Check-in 3PM, check-out 11AM. Beside Ayala Malls Serin. ' +
              'Answer concisely in the same language as the guest (English, Tagalog, or Taglish).';

            return window.ai.languageModel.create({ systemPrompt: sysPrompt })
              .then(function(session) {
                return session.prompt('Guest question: ' + text + '\nAnswer:');
              })
              .then(function(nanoReply) {
                if (nanoReply && nanoReply.trim().length > 0) {
                  appendChatMessage(nanoReply.trim(), 'bot', fallback.bookingAction);
                } else {
                  appendChatMessage(fallback.text, 'bot', fallback.bookingAction);
                }
              });
          } else {
            appendChatMessage(fallback.text, 'bot', fallback.bookingAction);
          }
        }).catch(function() {
          appendChatMessage(fallback.text, 'bot', fallback.bookingAction);
        });
        return;
      } catch (err) {
        // Fall back to deterministic reply
      }
    }

    appendChatMessage(fallback.text, 'bot', fallback.bookingAction);
  }

  function appendChatMessage(msgText, sender, bookingAction) {
    var messagesEl = document.getElementById('aiChatMessages');
    if (!messagesEl) return;

    var msgDiv = document.createElement('div');
    msgDiv.className = 'ai-msg ai-msg-' + sender;

    var bubble = document.createElement('div');
    bubble.className = 'ai-msg-bubble';
    bubble.innerHTML = escapeHtml(msgText).replace(/\n/g, '<br>');
    msgDiv.appendChild(bubble);

    if (bookingAction) {
      var actionBtn = document.createElement('button');
      actionBtn.type = 'button';
      actionBtn.className = 'ai-apply-booking-btn';
      actionBtn.innerHTML = '📅 Apply to Booking Form (' + bookingAction.startDate + ' to ' + bookingAction.endDate + ')';
      actionBtn.onclick = function() {
        applyAgentDatesToBookingForm(bookingAction.startDate, bookingAction.endDate, bookingAction.guestCount);
      };
      msgDiv.appendChild(actionBtn);
    }

    messagesEl.appendChild(msgDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function applyAgentDatesToBookingForm(start, end, guests) {
    var guestCountSelect = document.getElementById('guestCount');
    if (guestCountSelect && guests) {
      guestCountSelect.value = String(guests);
    }
    applyConfirmedDateRange(start, end);
    toggleAiChatDrawer(false);
    var formEl = document.getElementById('bookingForm');
    if (formEl) formEl.scrollIntoView({ behavior: 'smooth' });
  }
</script>
