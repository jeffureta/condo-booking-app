<script>
  /**
   * Client-side Controller for Condominium Booking App.
   * Manages bespoke zero-dependency calendar grid rendering, interactive drag/click selection,
   * form validation, and Google Apps Script backend submissions.
   */
  var CALENDAR_ID = '5e250418f97d2008bff93cc10a638b2aabe981af2d5e271b058eb8835dde2ae2@group.calendar.google.com';
  var currentReservation = null;
  var currentBookedRanges = [];
  var isInternalCalendarSync = false;

  // Calendar Grid State
  var currentDisplayDate = new Date(); // Tracks currently displayed month/year
  var selectionAnchor = null;         // Start date of drag or first click (YYYY-MM-DD)
  var selectionHover = null;          // Currently hovered date during drag (YYYY-MM-DD)
  var isDragging = false;             // True while mouse button is held down

  function toIso(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  var todayStr = toIso(new Date());

  function bootstrapApp() {
    // Set min date on date inputs to today
    var inInput = document.getElementById('checkInDate');
    var outInput = document.getElementById('checkOutDate');
    if (inInput) inInput.min = todayStr;
    if (outInput) outInput.min = todayStr;

    initCustomCalendar();
    fetchBookedRanges();
  }

  function fetchBookedRanges() {
    hideCalendarError();
    announceStatus("Fetching Google Calendar availability...");
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(onBookedRangesLoaded)
        .withFailureHandler(onBookedRangesError)
        .getBookedRanges();
    } else {
      // Local preview fallback mock
      onBookedRangesLoaded([
        { from: '2026-11-10', to: '2026-11-13', title: 'Existing Reservation' }
      ]);
    }
  }

  function retryFetchAvailability() {
    var retryBtn = document.getElementById('calendarRetryBtn');
    if (retryBtn) {
      retryBtn.disabled = true;
      retryBtn.textContent = 'Retrying...';
    }
    fetchBookedRanges();
  }

  function showCalendarError(err) {
    console.error('[CondoCalendar] Failed to load calendar availability:', err);
    var banner = document.getElementById('calendarErrorBanner');
    var msgEl = document.getElementById('calendarErrorMessage');
    var retryBtn = document.getElementById('calendarRetryBtn');

    if (banner && msgEl) {
      var detail = err && (err.message || (typeof err === 'string' ? err : ''));
      msgEl.textContent = detail 
        ? 'Unable to load dates: ' + detail + '. Please check your connection and retry.'
        : 'Unable to load dates from Google Calendar. Please click Retry.';
      banner.style.display = 'flex';
    }
    if (retryBtn) {
      retryBtn.disabled = false;
      retryBtn.textContent = 'Retry';
    }
    announceStatus("Failed to load Google Calendar availability.");
  }

  function hideCalendarError() {
    var banner = document.getElementById('calendarErrorBanner');
    if (banner) {
      banner.style.display = 'none';
    }
    var retryBtn = document.getElementById('calendarRetryBtn');
    if (retryBtn) {
      retryBtn.disabled = false;
      retryBtn.textContent = 'Retry';
    }
  }

  function onBookedRangesError(err) {
    showCalendarError(err);
    // Render the month grid so the user can at least view the calendar days
    onBookedRangesLoaded([]);
  }

  // Handle both standard DOM loading and Google Apps Script sandboxed iframe execution
  if (document.readyState === 'interactive' || document.readyState === 'complete') {
    bootstrapApp();
  } else {
    window.addEventListener('DOMContentLoaded', bootstrapApp);
  }

  function initCustomCalendar() {
    var prevBtn = document.getElementById('calPrevBtn');
    var nextBtn = document.getElementById('calNextBtn');

    if (prevBtn) {
      prevBtn.addEventListener('click', function() {
        currentDisplayDate.setMonth(currentDisplayDate.getMonth() - 1);
        renderCalendar();
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', function() {
        currentDisplayDate.setMonth(currentDisplayDate.getMonth() + 1);
        renderCalendar();
      });
    }

    // Global mouseup to guarantee drag ends even if cursor releases outside grid
    window.addEventListener('mouseup', function() {
      if (isDragging) {
        finalizeSelection();
      }
    });

    renderCalendar();
  }

  function renderCalendar() {
    try {
      var gridEl = document.getElementById('customCalendarGrid');
      var titleEl = document.getElementById('calMonthTitle');
      if (!gridEl || !titleEl) return;

      var year = currentDisplayDate.getFullYear();
      var month = currentDisplayDate.getMonth();

      // Update Header (e.g., "November 2026")
      var monthName = currentDisplayDate.toLocaleString('default', { month: 'long' });
      titleEl.textContent = monthName + ' ' + year;

      gridEl.innerHTML = '';

      // Calculate first day of month and grid start
      var firstDay = new Date(year, month, 1);
      var startDayOfWeek = firstDay.getDay(); // 0 = Sunday
      var startDate = new Date(year, month, 1 - startDayOfWeek);

      var inVal = document.getElementById('checkInDate').value;
      var outVal = document.getElementById('checkOutDate').value;

      for (var i = 0; i < 42; i++) {
        var cellDate = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate() + i);
        var iso = toIso(cellDate);
        var dayNum = cellDate.getDate();
        var isCurrentMonth = cellDate.getMonth() === month;

        var cell = document.createElement('div');
        cell.className = 'cal-cell';
        cell.dataset.date = iso;
        cell.setAttribute('role', 'gridcell');
        cell.setAttribute('tabindex', '0');
        cell.setAttribute('aria-label', iso);

        var numSpan = document.createElement('span');
        numSpan.textContent = dayNum;
        cell.appendChild(numSpan);

        if (!isCurrentMonth) {
          cell.classList.add('cal-other-month');
        }

        if (iso === todayStr) {
          cell.classList.add('cal-today');
        }

        // Check if date is in the past
        if (iso < todayStr) {
          cell.classList.add('cal-disabled');
          cell.setAttribute('aria-disabled', 'true');
        }

        // Check if date is booked (turnover on checkout day is allowed for check-in)
        var isOccupied = currentBookedRanges.some(function(r) {
          return iso >= r.from && iso < r.to;
        });
        if (isOccupied) {
          cell.classList.add('cal-booked');
          cell.setAttribute('aria-disabled', 'true');
        }

        // Apply active selection or hover-drag range classes
        applyCellSelectionClasses(cell, iso, inVal, outVal);

        // Event Listeners for Click and Continuous Drag
        attachCellEvents(cell, iso);

        gridEl.appendChild(cell);
      }
    } catch (err) {
      console.error('[CondoCalendar] Error rendering calendar grid:', err);
      showCalendarError(err);
    }
  }

  function applyCellSelectionClasses(cell, iso, inVal, outVal) {
    var activeStart = inVal;
    var activeEnd = outVal;

    // If currently dragging, preview the dynamic range
    if (isDragging && selectionAnchor && selectionHover) {
      if (selectionAnchor <= selectionHover) {
        activeStart = selectionAnchor;
        activeEnd = selectionHover;
      } else {
        activeStart = selectionHover;
        activeEnd = selectionAnchor;
      }
    }

    if (activeStart && activeEnd && activeStart !== activeEnd) {
      if (iso === activeStart) {
        cell.classList.add('cal-selected-start');
      } else if (iso === activeEnd) {
        cell.classList.add('cal-selected-end');
      } else if (iso > activeStart && iso < activeEnd) {
        cell.classList.add('cal-in-range');
      }
    } else if (activeStart && (!activeEnd || activeStart === activeEnd)) {
      if (iso === activeStart) {
        cell.classList.add('cal-selected-single');
      }
    }
  }

  function attachCellEvents(cell, iso) {
    var isPast = iso < todayStr;
    var isOccupied = currentBookedRanges.some(function(r) {
      return iso >= r.from && iso < r.to;
    });

    // MOUSE DOWN: start selection or drag
    cell.addEventListener('mousedown', function(e) {
      e.preventDefault();
      if (isPast || isOccupied) return;

      isDragging = true;
      selectionAnchor = iso;
      selectionHover = iso;
      highlightPreviewRange(selectionAnchor, selectionHover);
    });

    // MOUSE ENTER: update range while dragging
    cell.addEventListener('mouseenter', function() {
      if (!isDragging || !selectionAnchor) return;
      selectionHover = iso;
      highlightPreviewRange(selectionAnchor, selectionHover);
    });

    // TOUCH SUPPORT
    cell.addEventListener('touchstart', function(e) {
      if (isPast || isOccupied) return;
      isDragging = true;
      selectionAnchor = iso;
      selectionHover = iso;
      highlightPreviewRange(selectionAnchor, selectionHover);
    }, { passive: true });

    cell.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      var touch = e.touches[0];
      var target = document.elementFromPoint(touch.clientX, touch.clientY);
      var cellTarget = target ? target.closest('.cal-cell') : null;
      if (cellTarget && cellTarget.dataset.date) {
        selectionHover = cellTarget.dataset.date;
        highlightPreviewRange(selectionAnchor, selectionHover);
      }
    }, { passive: true });

    cell.addEventListener('touchend', function() {
      if (isDragging) {
        finalizeSelection();
      }
    });

    // KEYBOARD ACCESSIBILITY: Enter / Space to pick date
    cell.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (isPast || isOccupied) return;
        handleCellClick(iso);
      }
    });
  }

  function highlightPreviewRange(anchor, hover) {
    if (!anchor || !hover) return;
    var range = anchor <= hover ? [anchor, hover] : [hover, anchor];
    var start = range[0];
    var end = range[1];

    var allCells = document.querySelectorAll('.cal-cell');
    allCells.forEach(function(c) {
      var d = c.dataset.date;
      c.classList.remove('cal-selected-start', 'cal-selected-end', 'cal-in-range', 'cal-selected-single');
      if (start === end) {
        if (d === start) c.classList.add('cal-selected-single');
      } else {
        if (d === start) c.classList.add('cal-selected-start');
        else if (d === end) c.classList.add('cal-selected-end');
        else if (d > start && d < end) c.classList.add('cal-in-range');
      }
    });
  }

  function finalizeSelection() {
    isDragging = false;
    if (!selectionAnchor || !selectionHover) return;

    var checkIn = selectionAnchor;
    var checkOut = selectionHover;

    if (selectionAnchor > selectionHover) {
      checkIn = selectionHover;
      checkOut = selectionAnchor;
    }

    // If single day was clicked/dragged, wait for second click or set checkIn
    if (checkIn === checkOut) {
      handleCellClick(checkIn);
      return;
    }

    applyConfirmedDateRange(checkIn, checkOut);
    selectionAnchor = null;
    selectionHover = null;
  }

  function handleCellClick(iso) {
    var inInput = document.getElementById('checkInDate');
    var outInput = document.getElementById('checkOutDate');

    if (!inInput.value || (inInput.value && outInput.value)) {
      // First click: set check-in
      inInput.value = iso;
      outInput.value = '';
      outInput.min = iso;
      hideStaySummary();
      renderCalendar();
      announceStatus('Selected check-in date: ' + iso + '. Now select check-out date.');
    } else {
      // Second click: set check-out
      var existingIn = inInput.value;
      if (iso <= existingIn) {
        // If clicked date is earlier, treat it as new check-in date
        inInput.value = iso;
        outInput.value = '';
        outInput.min = iso;
        hideStaySummary();
        renderCalendar();
        announceStatus('Updated check-in date: ' + iso + '. Now select check-out date.');
      } else {
        applyConfirmedDateRange(existingIn, iso);
      }
    }
  }

  function applyConfirmedDateRange(checkIn, checkOut) {
    var statusMsg = document.getElementById('statusMessage');
    var inInput = document.getElementById('checkInDate');
    var outInput = document.getElementById('checkOutDate');

    if (checkIn < todayStr) {
      statusMsg.textContent = "⚠️ Check-in date cannot be in the past.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    if (rangeHasConflict(checkIn, checkOut)) {
      statusMsg.textContent = "⚠️ The selected date range overlaps with an existing reservation. Please select available dates.";
      statusMsg.style.color = "#b91c1c";
      renderCalendar();
      return;
    }

    statusMsg.textContent = '';
    isInternalCalendarSync = true;
    inInput.value = checkIn;
    outInput.value = checkOut;
    outInput.min = checkIn;
    isInternalCalendarSync = false;

    updateStaySummary(new Date(checkIn + 'T00:00:00'), new Date(checkOut + 'T00:00:00'));
    announceStatus('Selected check-in: ' + checkIn + ', check-out: ' + checkOut);
    renderCalendar();
  }

  function onBookedRangesLoaded(ranges) {
    hideCalendarError();
    currentBookedRanges = ranges || [];
    announceStatus("Google Calendar availability updated.");
    renderCalendar();
  }

  function onDateInputChange() {
    var inVal = document.getElementById('checkInDate').value;
    var outVal = document.getElementById('checkOutDate').value;
    var outInput = document.getElementById('checkOutDate');

    if (inVal && outInput) {
      outInput.min = inVal;
    }

    if (inVal && outVal) {
      if (outVal <= inVal) {
        document.getElementById('statusMessage').textContent = "⚠️ Check-out date must be after check-in date.";
        document.getElementById('statusMessage').style.color = "#b91c1c";
        hideStaySummary();
        renderCalendar();
        return;
      }
      if (rangeHasConflict(inVal, outVal)) {
        document.getElementById('statusMessage').textContent = "⚠️ Selected range overlaps with an existing reservation on Google Calendar.";
        document.getElementById('statusMessage').style.color = "#b91c1c";
        hideStaySummary();
        renderCalendar();
        return;
      }

      document.getElementById('statusMessage').textContent = "";
      updateStaySummary(new Date(inVal + 'T00:00:00'), new Date(outVal + 'T00:00:00'));
      announceStatus('Selected check-in: ' + inVal + ', check-out: ' + outVal);
      renderCalendar();
    } else {
      hideStaySummary();
      renderCalendar();
    }
  }

  function rangeHasConflict(start, end) {
    return currentBookedRanges.some(function(r) {
      return start < r.to && end > r.from;
    });
  }

  function updateStaySummary(startDate, endDate) {
    var card = document.getElementById('staySummaryCard');
    var inEl = document.getElementById('summaryCheckIn');
    var outEl = document.getElementById('summaryCheckOut');
    var nightsEl = document.getElementById('summaryNights');

    var opts = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
    inEl.textContent = startDate.toLocaleDateString(undefined, opts);
    outEl.textContent = endDate.toLocaleDateString(undefined, opts);

    var diffTime = Math.abs(endDate - startDate);
    var nights = Math.round(diffTime / (1000 * 60 * 60 * 24));
    nightsEl.textContent = nights === 1 ? '1 night' : (nights + ' nights');

    card.style.display = 'flex';
  }

  function hideStaySummary() {
    var card = document.getElementById('staySummaryCard');
    if (card) card.style.display = 'none';
  }

  function submitReservation(e) {
    e.preventDefault();
    var statusMsg = document.getElementById('statusMessage');
    statusMsg.textContent = '';

    var checkIn = document.getElementById('checkInDate').value;
    var checkOut = document.getElementById('checkOutDate').value;

    if (!checkIn || !checkOut) {
      statusMsg.textContent = "⚠️ Please select both a check-in and check-out date.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    if (checkOut <= checkIn) {
      statusMsg.textContent = "⚠️ Check-out date must be after check-in date.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    if (rangeHasConflict(checkIn, checkOut)) {
      statusMsg.textContent = "⚠️ Dates conflict with an existing booking. Please pick another date range.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    var name = document.getElementById('guestName').value.trim();
    var email = document.getElementById('guestEmail').value.trim();
    var phone = document.getElementById('guestPhone').value.trim();
    var guestCount = document.getElementById('guestCount').value;

    if (!name || !email || !phone) {
      statusMsg.textContent = "⚠️ Please fill in all required contact details.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    var payload = {
      startDate: checkIn,
      endDate: checkOut,
      guestName: name,
      guestEmail: email,
      guestPhone: phone,
      guestCount: parseInt(guestCount, 10)
    };

    var submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span>Processing reservation...</span>';
    announceStatus("Submitting reservation to Google Calendar...");

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      // Calls createBooking (and processBooking alias is also available on backend)
      google.script.run
        .withSuccessHandler(function(res) {
          resetSubmitButton();
          if (res.success) {
            handleBookingSuccess(res, payload);
          } else {
            statusMsg.textContent = '⚠️ ' + (res.message || "Could not complete reservation.");
            statusMsg.style.color = "#b91c1c";
          }
        })
        .withFailureHandler(function(err) {
          resetSubmitButton();
          statusMsg.textContent = '⚠️ Connection error: ' + (err.message || err) + '. Please try again.';
          statusMsg.style.color = "#b91c1c";
        })
        .createBooking(payload);
    } else {
      // Local preview / mock fallback
      setTimeout(function() {
        resetSubmitButton();
        var mockRef = 'LOCAL-' + Math.floor(100000 + Math.random() * 900000);
        handleBookingSuccess({ success: true, referenceId: mockRef }, payload);
      }, 500);
    }
  }

  function handleBookingSuccess(res, data) {
    var ref = res.referenceId || res.refId;
    currentReservation = {
      startDate: data.startDate,
      endDate: data.endDate,
      guestName: data.guestName,
      guestEmail: data.guestEmail,
      guestPhone: data.guestPhone,
      guestCount: data.guestCount,
      referenceId: ref
    };

    document.getElementById('bookingForm').style.display = 'none';
    var confBox = document.getElementById('confirmationBox');
    confBox.style.display = 'block';

    document.getElementById('confText').innerHTML = 
      'Thank you, <strong>' + escapeHtml(data.guestName) + '</strong>! Your reservation for <strong>' + escapeHtml(String(data.guestCount)) + ' guest(s)</strong> ' +
      'from <strong>' + data.startDate + '</strong> to <strong>' + data.endDate + '</strong> is confirmed.<br><br>' +
      '<strong>Reference ID:</strong> #' + ref + '<br>' +
      'A confirmation email has been dispatched to <em>' + escapeHtml(data.guestEmail) + '</em>.<br>' +
      'Your stay has been recorded in our Google Calendar.';

    setupGoogleCalendarLink(ref);
    announceStatus('Reservation confirmed! Your reference ID is ' + ref + '.');
    confBox.scrollIntoView({ behavior: 'smooth' });
  }

  function resetSubmitButton() {
    var submitBtn = document.getElementById('submitBtn');
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<span>Confirm and Lock in Reservation</span>';
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>'"]/g, function(tag) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag;
    });
  }

  function setupGoogleCalendarLink(refId) {
    var inVal = document.getElementById('checkInDate').value;
    var outVal = document.getElementById('checkOutDate').value;
    if (!inVal || !outVal) return;

    var s = inVal.replace(/-/g, '');
    var e = outVal.replace(/-/g, '');
    var title = encodeURIComponent("Stay at 2-Bedroom Condominium (Ref #" + refId + ")");
    var details = encodeURIComponent("Condo Reservation Ref #" + refId + "\nCheck-in: 3:00 PM\nCheck-out: 11:00 AM");
    var loc = encodeURIComponent("418 Serin Tagaytay Condominium");

    // Construct protocol safely to avoid ES5 comment-stripping hazards
    var proto = 'https:' + '//';
    var url = proto + 'calendar.google.com/calendar/render?action=TEMPLATE&text=' + title + '&dates=' + s + 'T150000/' + e + 'T110000&details=' + details + '&location=' + loc;
    var btn = document.getElementById('addToGoogleCalBtn');
    if (btn) btn.href = url;
  }

  function downloadIcsFile() {
    if (!currentReservation) return;
    var inVal = currentReservation.startDate.replace(/-/g, '');
    var outVal = currentReservation.endDate.replace(/-/g, '');
    var ref = currentReservation.referenceId;
    var slashSlash = '/' + '/';

    var icsContent = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-" + slashSlash + "Condo Booking" + slashSlash + "EN",
      "BEGIN:VEVENT",
      "UID:condo-" + ref + "@booking.local",
      "DTSTAMP:" + toIso(new Date()).replace(/-/g, '') + "T000000Z",
      "DTSTART:" + inVal + "T150000",
      "DTEND:" + outVal + "T110000",
      "SUMMARY:Stay at 2-Bedroom Condominium (Ref #" + ref + ")",
      "DESCRIPTION:Condominium Reservation Ref #" + ref + "\\nGuest: " + currentReservation.guestName + "\\nGuests: " + currentReservation.guestCount,
      "LOCATION:418 Serin Tagaytay Condominium",
      "STATUS:CONFIRMED",
      "END:VEVENT",
      "END:VCALENDAR"
    ].join("\r\n");

    var blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
    var link = document.createElement('a');
    link.href = window.URL.createObjectURL(blob);
    link.setAttribute('download', 'condo-booking-' + ref + '.ics');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function announceStatus(msg) {
    var sr = document.getElementById('srAnnouncement');
    if (sr) sr.textContent = msg;
  }
</script>
