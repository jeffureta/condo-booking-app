  function toIso(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1);
    if (m.length < 2) m = '0' + m;
    var day = String(d.getDate());
    if (day.length < 2) day = '0' + day;
    return y + '-' + m + '-' + day;
  }

  function getSeasonForDate(dateStr) {
    var month = parseInt(dateStr.slice(5, 7), 10);
    if (month === 12 || month === 1 || month === 2) {
      return {
        code: 'AMIHAN_COOL',
        icon: '❄️',
        label: 'Cool Amihan Season (17–24°C)',
        desc: 'Crisp breezes & clear Taal views. Peak staycation season.',
        weekdayMult: 1.10,
        weekendMult: 1.10
      };
    }
    if (month >= 3 && month <= 5) {
      return {
        code: 'SUMMER_ESCAPE',
        icon: '☀️',
        label: 'Summer Ridge Escape',
        desc: 'Sunny mountain breeze escaping Manila heat.',
        weekdayMult: 1.05,
        weekendMult: 1.05
      };
    }
    if (month === 11) {
      return {
        code: 'BER_SHOULDER',
        icon: '🌤️',
        label: 'Ber-Months Shoulder Season',
        desc: 'Cooling weather leading into December holidays.',
        weekdayMult: 1.00,
        weekendMult: 1.00
      };
    }
    return {
      code: 'HABAGAT_RAINY',
      icon: '🌧️',
      label: 'Habagat Cozy Rainy Season',
      desc: 'Misty fog & quiet indoor staycation discounts.',
      weekdayMult: 0.90,
      weekendMult: 0.95
    };
  }

  function getHolidayOrEvent(dateStr) {
    if (PH_HOLIDAYS_AND_EVENTS[dateStr]) {
      return PH_HOLIDAYS_AND_EVENTS[dateStr];
    }
    var mmDd = dateStr.slice(5, 10);
    if (PH_HOLIDAYS_AND_EVENTS[mmDd]) {
      return PH_HOLIDAYS_AND_EVENTS[mmDd];
    }
    return null;
  }

  function calculateNightlyPrice(dateStr) {
    var holiday = getHolidayOrEvent(dateStr);
    var season = getSeasonForDate(dateStr);
    var dObj = new Date(dateStr + 'T00:00:00');
    var dayOfWeek = dObj.getDay();
    var isWeekend = dayOfWeek === 0 || dayOfWeek === 5 || dayOfWeek === 6;

    var tier = 'WEEKDAY';
    var tierLabel = 'Weekday';
    var baseMarket = 5000;
    var mult = season.weekdayMult;

    if (holiday) {
      tier = 'PEAK';
      tierLabel = holiday;
      baseMarket = 8000;
      mult = 1.0;
    } else if (isWeekend) {
      tier = 'WEEKEND';
      tierLabel = 'Weekend';
      baseMarket = 6200;
      mult = season.weekendMult;
    }

    var marketRate = Math.round((baseMarket * mult) / 50) * 50;
    var unitRate = marketRate - 500; // Guaranteed -₱500/night savings

    return {
      dateStr: dateStr,
      tier: tier,
      tierLabel: tierLabel,
      season: season,
      marketRate: marketRate,
      unitRate: unitRate,
      savings: 500
    };
  }

  function calculateStayQuote(checkInStr, checkOutStr, guestCount) {
    if (!checkInStr || !checkOutStr || checkOutStr <= checkInStr) return null;

    var inDate = new Date(checkInStr + 'T00:00:00');
    var outDate = new Date(checkOutStr + 'T00:00:00');
    var diffMs = outDate.getTime() - inDate.getTime();
    var nights = Math.max(0, Math.round(diffMs / (1000 * 60 * 60 * 24)));
    if (nights === 0) return null;

    var guests = Math.min(6, Math.max(1, parseInt(guestCount, 10) || 2));
    var extraGuests = Math.max(0, guests - 4);

    var marketSubtotal = 0;
    var baseUnitSubtotal = 0;
    var nightlyList = [];

    for (var i = 0; i < nights; i++) {
      var cur = new Date(inDate.getTime() + i * (24 * 60 * 60 * 1000));
      var iso = toIso(cur);
      var nInfo = calculateNightlyPrice(iso);
      nightlyList.push(nInfo);
      marketSubtotal += nInfo.marketRate;
      baseUnitSubtotal += nInfo.unitRate;
    }

    var discountRate = 0;
    var discountLabel = '';
    if (nights >= 7) {
      discountRate = 0.10;
      discountLabel = 'Weekly Staycation (10% Off)';
    } else if (nights >= 3) {
      discountRate = 0.05;
      discountLabel = 'Extended Staycation (5% Off)';
    }

    var discountAmount = Math.round(baseUnitSubtotal * discountRate);
    var extraGuestFee = extraGuests * 400 * nights;
    var totalPrice = baseUnitSubtotal - discountAmount + extraGuestFee;
    var competitorSavings = 500 * nights;
    var totalSavings = competitorSavings + discountAmount;

    return {
      checkIn: checkInStr,
      checkOut: checkOutStr,
      nights: nights,
      guestCount: guests,
      extraGuests: extraGuests,
      marketSubtotal: marketSubtotal,
      baseUnitSubtotal: baseUnitSubtotal,
      competitorSavings: competitorSavings,
      discountRate: discountRate,
      discountLabel: discountLabel,
      discountAmount: discountAmount,
      extraGuestFee: extraGuestFee,
      totalPrice: totalPrice,
      totalSavings: totalSavings,
      averageNightly: Math.round(totalPrice / nights),
      nightlyList: nightlyList
    };
  }

  function formatPhp(amount) {
    return '₱' + Math.round(amount).toLocaleString('en-US');
  }

  /* ==========================================================================

     ========================================================================== */
  function bootstrapApp() {
    var inInput = document.getElementById('checkInDate');
    var outInput = document.getElementById('checkOutDate');
    if (inInput) inInput.min = todayStr;
    if (outInput) outInput.min = todayStr;

    initCustomCalendar();
    fetchBookedRanges();
  }

  function fetchBookedRanges() {
    hideCalendarError();
    announceStatus("Fetching Google Calendar availability...");
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(onBookedRangesLoaded)
        .withFailureHandler(onBookedRangesError)
        .getBookedRanges();
    } else {
      // Local preview fallback mock
      onBookedRangesLoaded([
        { from: '2026-11-18', to: '2026-11-20', title: 'Reserved Guest' }
      ]);
    }
  }

  function retryFetchAvailability() {
    var retryBtn = document.getElementById('calendarRetryBtn');
    if (retryBtn) {
      retryBtn.disabled = true;
      retryBtn.textContent = 'Retrying...';
    }
    fetchBookedRanges();
  }

  function showCalendarError(err) {
    console.error('[CondoCalendar] Failed to load calendar availability:', err);
    var banner = document.getElementById('calendarErrorBanner');
    var msgEl = document.getElementById('calendarErrorMessage');
    var retryBtn = document.getElementById('calendarRetryBtn');

    if (banner && msgEl) {
      var detail = err && (err.message || (typeof err === 'string' ? err : ''));
      msgEl.textContent = detail 
        ? 'Unable to load dates: ' + detail + '. Please check your connection and retry.'
        : 'Unable to load dates from Google Calendar. Please click Retry.';
      banner.style.display = 'flex';
    }
    if (retryBtn) {
      retryBtn.disabled = false;
      retryBtn.textContent = 'Retry';
    }
    announceStatus("Failed to load Google Calendar availability.");
  }

  function hideCalendarError() {
    var banner = document.getElementById('calendarErrorBanner');
    if (banner) {
      banner.style.display = 'none';
    }
    var retryBtn = document.getElementById('calendarRetryBtn');
    if (retryBtn) {
      retryBtn.disabled = false;
      retryBtn.textContent = 'Retry';
    }
  }

  function onBookedRangesError(err) {
    showCalendarError(err);
    onBookedRangesLoaded([]);
  }

  if (document.readyState === 'interactive' || document.readyState === 'complete') {
    bootstrapApp();
  } else {
    window.addEventListener('DOMContentLoaded', bootstrapApp);
  }

  /* ==========================================================================
     CUSTOM CALENDAR GRID RENDERING & SELECTION CONTROLLER
     ========================================================================== */
  function initCustomCalendar() {
    var prevBtn = document.getElementById('calPrevBtn');
    var nextBtn = document.getElementById('calNextBtn');

    if (prevBtn) {
      prevBtn.addEventListener('click', function() {
        currentDisplayDate.setMonth(currentDisplayDate.getMonth() - 1);
        renderCalendar();
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', function() {
        currentDisplayDate.setMonth(currentDisplayDate.getMonth() + 1);
        renderCalendar();
      });
    }

    window.addEventListener('mouseup', function() {
      if (isDragging) {
        finalizeSelection();
      }
    });

    renderCalendar();
  }

  function renderCalendar() {
    try {
      var gridEl = document.getElementById('customCalendarGrid');
      var titleEl = document.getElementById('calMonthTitle');
      if (!gridEl || !titleEl) return;

      var year = currentDisplayDate.getFullYear();
      var month = currentDisplayDate.getMonth();

      var monthName = currentDisplayDate.toLocaleString('default', { month: 'long' });
      titleEl.textContent = monthName + ' ' + year;

      // Update Season Indicator Banner
      updateSeasonBanner(currentDisplayDate);

      gridEl.innerHTML = '';

      var firstDay = new Date(year, month, 1);
      var startDayOfWeek = firstDay.getDay();
      var startDate = new Date(year, month, 1 - startDayOfWeek);

      var inVal = document.getElementById('checkInDate').value;
      var outVal = document.getElementById('checkOutDate').value;

      for (var i = 0; i < 42; i++) {
        var cellDate = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate() + i);
        var iso = toIso(cellDate);
        var dayNum = cellDate.getDate();
        var isCurrentMonth = cellDate.getMonth() === month;

        var priceInfo = calculateNightlyPrice(iso);

        var cell = document.createElement('div');
        cell.className = 'cal-cell';
        cell.dataset.date = iso;
        cell.setAttribute('role', 'gridcell');
        cell.setAttribute('tabindex', '0');

        if (priceInfo.tier === 'PEAK') {
          cell.classList.add('cal-peak-date');
        }

        var labelText = iso + ': ' + formatPhp(priceInfo.unitRate) + ' / night (' + priceInfo.tierLabel + ', ' + priceInfo.season.label + ')';
        cell.setAttribute('aria-label', labelText);
        cell.setAttribute('title', labelText);

        var daySpan = document.createElement('span');
        daySpan.className = 'cal-cell-day';
        daySpan.textContent = dayNum;
        cell.appendChild(daySpan);

        var priceSpan = document.createElement('span');
        priceSpan.className = 'cal-cell-price';
        priceSpan.textContent = formatPhp(priceInfo.unitRate);
        cell.appendChild(priceSpan);

        if (!isCurrentMonth) {
          cell.classList.add('cal-other-month');
        }

        if (iso === todayStr) {
          cell.classList.add('cal-today');
        }

        if (iso < todayStr) {
          cell.classList.add('cal-disabled');
          cell.setAttribute('aria-disabled', 'true');
        }

        var isOccupied = currentBookedRanges.some(function(r) {
          return iso >= r.from && iso < r.to;
        });
        if (isOccupied) {
          cell.classList.add('cal-booked');
          cell.setAttribute('aria-disabled', 'true');
        }

        applyCellSelectionClasses(cell, iso, inVal, outVal);
        attachCellEvents(cell, iso);

        gridEl.appendChild(cell);
      }
    } catch (err) {
      console.error('[CondoCalendar] Error rendering calendar grid:', err);
      showCalendarError(err);
    }
  }

  function updateSeasonBanner(d) {
    var iso = toIso(d);
    var season = getSeasonForDate(iso);
    var iconEl = document.getElementById('calendarSeasonIcon');
    var titleEl = document.getElementById('calendarSeasonTitle');
    var descEl = document.getElementById('calendarSeasonDesc');

    if (iconEl) iconEl.textContent = season.icon;
    if (titleEl) titleEl.textContent = season.label + ' • Unit 418 Dynamic Rate';
    if (descEl) descEl.textContent = season.desc;
  }

  function applyCellSelectionClasses(cell, iso, inVal, outVal) {
    var activeStart = inVal;
    var activeEnd = outVal;

    if (isDragging && selectionAnchor && selectionHover) {
      if (selectionAnchor <= selectionHover) {
        activeStart = selectionAnchor;
        activeEnd = selectionHover;
      } else {
        activeStart = selectionHover;
        activeEnd = selectionAnchor;
      }
    }

    if (activeStart && activeEnd && activeStart !== activeEnd) {
      if (iso === activeStart) {
        cell.classList.add('cal-selected-start');
      } else if (iso === activeEnd) {
        cell.classList.add('cal-selected-end');
      } else if (iso > activeStart && iso < activeEnd) {
        cell.classList.add('cal-in-range');
      }
    } else if (activeStart && (!activeEnd || activeStart === activeEnd)) {
      if (iso === activeStart) {
        cell.classList.add('cal-selected-single');
      }
    }
  }

  function attachCellEvents(cell, iso) {
    var isPast = iso < todayStr;
    var isOccupied = currentBookedRanges.some(function(r) {
      return iso >= r.from && iso < r.to;
    });

    cell.addEventListener('mousedown', function(e) {
      e.preventDefault();
      if (isPast || isOccupied) return;

      isDragging = true;
      selectionAnchor = iso;
      selectionHover = iso;
      highlightPreviewRange(selectionAnchor, selectionHover);
    });

    cell.addEventListener('mouseenter', function() {
      if (!isDragging || !selectionAnchor) return;
      selectionHover = iso;
      highlightPreviewRange(selectionAnchor, selectionHover);
    });

    cell.addEventListener('touchstart', function(e) {
      if (isPast || isOccupied) return;
      isDragging = true;
      selectionAnchor = iso;
      selectionHover = iso;
      highlightPreviewRange(selectionAnchor, selectionHover);
    }, { passive: true });

    cell.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      var touch = e.touches[0];
      var target = document.elementFromPoint(touch.clientX, touch.clientY);
      var cellTarget = target ? target.closest('.cal-cell') : null;
      if (cellTarget && cellTarget.dataset.date) {
        selectionHover = cellTarget.dataset.date;
        highlightPreviewRange(selectionAnchor, selectionHover);
      }
    }, { passive: true });

    cell.addEventListener('touchend', function() {
      if (isDragging) {
        finalizeSelection();
      }
    });

    cell.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (isPast || isOccupied) return;
        handleCellClick(iso);
      }
    });
  }

  function highlightPreviewRange(anchor, hover) {
    if (!anchor || !hover) return;
    var start = anchor <= hover ? anchor : hover;
    var end = anchor <= hover ? hover : anchor;

    var allCells = document.querySelectorAll('.cal-cell');
    allCells.forEach(function(c) {
      var d = c.dataset.date;
      c.classList.remove('cal-selected-start', 'cal-selected-end', 'cal-in-range', 'cal-selected-single');
      if (start === end) {
        if (d === start) c.classList.add('cal-selected-single');
      } else {
        if (d === start) c.classList.add('cal-selected-start');
        else if (d === end) c.classList.add('cal-selected-end');
        else if (d > start && d < end) c.classList.add('cal-in-range');
      }
    });
  }

  function finalizeSelection() {
    isDragging = false;
    if (!selectionAnchor || !selectionHover) return;

    var checkIn = selectionAnchor <= selectionHover ? selectionAnchor : selectionHover;
    var checkOut = selectionAnchor <= selectionHover ? selectionHover : selectionAnchor;

    if (checkIn === checkOut) {
      handleCellClick(checkIn);
      return;
    }

    applyConfirmedDateRange(checkIn, checkOut);
    selectionAnchor = null;
    selectionHover = null;
  }

  function handleCellClick(iso) {
    var inInput = document.getElementById('checkInDate');
    var outInput = document.getElementById('checkOutDate');

    if (!inInput.value || (inInput.value && outInput.value)) {
      inInput.value = iso;
      outInput.value = '';
      outInput.min = iso;
      hideStaySummary();
      renderCalendar();
      announceStatus('Selected check-in date: ' + iso + '. Now select check-out date.');
    } else {
      var existingIn = inInput.value;
      if (iso <= existingIn) {
        inInput.value = iso;
        outInput.value = '';
        outInput.min = iso;
        hideStaySummary();
        renderCalendar();
        announceStatus('Updated check-in date: ' + iso + '. Now select check-out date.');
      } else {
        applyConfirmedDateRange(existingIn, iso);
      }
    }
  }

  function applyConfirmedDateRange(checkIn, checkOut) {
    var statusMsg = document.getElementById('statusMessage');
    var inInput = document.getElementById('checkInDate');
    var outInput = document.getElementById('checkOutDate');

    if (checkIn < todayStr) {
      statusMsg.textContent = "⚠️ Check-in date cannot be in the past.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    if (rangeHasConflict(checkIn, checkOut)) {
      statusMsg.textContent = "⚠️ The selected date range overlaps with an existing reservation. Please select available dates.";
      statusMsg.style.color = "#b91c1c";
      renderCalendar();
      return;
    }

    statusMsg.textContent = '';
    isInternalCalendarSync = true;
    inInput.value = checkIn;
    outInput.value = checkOut;
    outInput.min = checkIn;
    isInternalCalendarSync = false;

    updateStaySummary();
    announceStatus('Selected check-in: ' + checkIn + ', check-out: ' + checkOut);
    renderCalendar();
  }

  function onBookedRangesLoaded(ranges) {
    hideCalendarError();
    currentBookedRanges = ranges || [];
    announceStatus("Google Calendar availability updated.");
    renderCalendar();
  }

  function onDateInputChange() {
    var inVal = document.getElementById('checkInDate').value;
    var outVal = document.getElementById('checkOutDate').value;
    var outInput = document.getElementById('checkOutDate');

    if (inVal && outInput) {
      outInput.min = inVal;
    }

    if (inVal && outVal) {
      if (outVal <= inVal) {
        document.getElementById('statusMessage').textContent = "⚠️ Check-out date must be after check-in date.";
        document.getElementById('statusMessage').style.color = "#b91c1c";
        hideStaySummary();
        renderCalendar();
        return;
      }
      if (rangeHasConflict(inVal, outVal)) {
        document.getElementById('statusMessage').textContent = "⚠️ Selected range overlaps with an existing reservation on Google Calendar.";
        document.getElementById('statusMessage').style.color = "#b91c1c";
        hideStaySummary();
        renderCalendar();
        return;
      }

      document.getElementById('statusMessage').textContent = "";
      updateStaySummary();
      announceStatus('Selected check-in: ' + inVal + ', check-out: ' + outVal);
      renderCalendar();
    } else {
      hideStaySummary();
      renderCalendar();
    }
  }

  function onGuestCountChange() {
    var inVal = document.getElementById('checkInDate').value;
    var outVal = document.getElementById('checkOutDate').value;
    if (inVal && outVal && outVal > inVal) {
      updateStaySummary();
    }
  }

  function rangeHasConflict(start, end) {
    return currentBookedRanges.some(function(r) {
      return start < r.to && end > r.from;
    });
  }

  function updateStaySummary() {
    var inVal = document.getElementById('checkInDate').value;
    var outVal = document.getElementById('checkOutDate').value;
    var guestCount = document.getElementById('guestCount').value;
    var card = document.getElementById('staySummaryCard');

    if (!inVal || !outVal || outVal <= inVal || !card) {
      hideStaySummary();
      return;
    }

    var quote = calculateStayQuote(inVal, outVal, guestCount);
    currentStayQuote = quote;
    if (!quote) {
      hideStaySummary();
      return;
    }

    var startDate = new Date(inVal + 'T00:00:00');
    var endDate = new Date(outVal + 'T00:00:00');
    var opts = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };

    var inEl = document.getElementById('summaryCheckIn');
    var outEl = document.getElementById('summaryCheckOut');
    var nightsEl = document.getElementById('summaryNights');

    if (inEl) inEl.textContent = startDate.toLocaleDateString(undefined, opts);
    if (outEl) outEl.textContent = endDate.toLocaleDateString(undefined, opts);
    if (nightsEl) nightsEl.textContent = quote.nights === 1 ? '1 night' : (quote.nights + ' nights');

    // Populate Pricing Breakdown Card
    var marketEl = document.getElementById('summaryMarketSubtotal');
    var unitEl = document.getElementById('summaryUnitSubtotal');
    var totalEl = document.getElementById('summaryTotalPrice');
    var savingsBadge = document.getElementById('summarySavingsBadge');
    var discountRow = document.getElementById('summaryDiscountRow');
    var discountLabel = document.getElementById('summaryDiscountLabel');
    var discountAmount = document.getElementById('summaryDiscountAmount');
    var extraRow = document.getElementById('summaryExtraGuestRow');
    var extraLabel = document.getElementById('summaryExtraGuestLabel');
    var extraAmount = document.getElementById('summaryExtraGuestAmount');

    if (marketEl) marketEl.textContent = formatPhp(quote.marketSubtotal);
    if (unitEl) unitEl.textContent = formatPhp(quote.baseUnitSubtotal);
    if (totalEl) totalEl.textContent = formatPhp(quote.totalPrice);
    if (savingsBadge) {
      savingsBadge.textContent = 'Save ' + formatPhp(quote.totalSavings) + ' vs. 10km market';
    }

    if (discountRow) {
      if (quote.discountAmount > 0) {
        if (discountLabel) discountLabel.textContent = quote.discountLabel + ':';
        if (discountAmount) discountAmount.textContent = '-' + formatPhp(quote.discountAmount);
        discountRow.style.display = 'flex';
      } else {
        discountRow.style.display = 'none';
      }
    }

    if (extraRow) {
      if (quote.extraGuestFee > 0) {
        if (extraLabel) extraLabel.textContent = 'Extra Guest Fee (' + quote.extraGuests + ' extra pax):';
        if (extraAmount) extraAmount.textContent = '+' + formatPhp(quote.extraGuestFee);
        extraRow.style.display = 'flex';
      } else {
        extraRow.style.display = 'none';
      }
    }

    card.style.display = 'flex';
  }

  function hideStaySummary() {
    var card = document.getElementById('staySummaryCard');
    if (card) card.style.display = 'none';
    currentStayQuote = null;
  }

  /* ==========================================================================
     RESERVATION SUBMISSION & CONFIRMATION
     ========================================================================== */
  function submitReservation(e) {
    e.preventDefault();
    var statusMsg = document.getElementById('statusMessage');
    statusMsg.textContent = '';

    var checkIn = document.getElementById('checkInDate').value;
    var checkOut = document.getElementById('checkOutDate').value;

    if (!checkIn || !checkOut) {
      statusMsg.textContent = "⚠️ Please select both a check-in and check-out date.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    if (checkOut <= checkIn) {
      statusMsg.textContent = "⚠️ Check-out date must be after check-in date.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    if (rangeHasConflict(checkIn, checkOut)) {
      statusMsg.textContent = "⚠️ Dates conflict with an existing booking. Please pick another date range.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    var name = document.getElementById('guestName').value.trim();
    var email = document.getElementById('guestEmail').value.trim();
    var phone = document.getElementById('guestPhone').value.trim();
    var guestCount = document.getElementById('guestCount').value;

    if (!name || !email || !phone) {
      statusMsg.textContent = "⚠️ Please fill in all required contact details.";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    var payload = {
      startDate: checkIn,
      endDate: checkOut,
      guestName: name,
      guestEmail: email,
      guestPhone: phone,
      guestCount: parseInt(guestCount, 10),
      clientQuote: currentStayQuote
    };

    var submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span>Processing reservation...</span>';
    announceStatus("Submitting staycation reservation...");

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          resetSubmitButton();
          if (res.success) {
            handleBookingSuccess(res, payload);
          } else {
            statusMsg.textContent = '⚠️ ' + (res.message || "Could not complete reservation.");
            statusMsg.style.color = "#b91c1c";
          }
        })
        .withFailureHandler(function(err) {
          resetSubmitButton();
          statusMsg.textContent = '⚠️ Connection error: ' + (err.message || err) + '. Please try again.';
          statusMsg.style.color = "#b91c1c";
        })
        .createBooking(payload);
    } else {
      // Local preview / mock fallback
      setTimeout(function() {
        resetSubmitButton();
        var mockRef = 'CND-' + Math.floor(1000 + Math.random() * 9000);
        var mockQuote = calculateStayQuote(payload.startDate, payload.endDate, payload.guestCount);
        handleBookingSuccess({
          success: true,
          referenceId: mockRef,
          totalPrice: mockQuote ? mockQuote.totalPrice : null,
          pricing: mockQuote
        }, payload);
      }, 500);
    }
  }

  function handleBookingSuccess(res, data) {
    var ref = res.referenceId || res.refId;
    var quote = res.pricing || currentStayQuote || calculateStayQuote(data.startDate, data.endDate, data.guestCount);
    var totalAmount = quote ? quote.totalPrice : (res.totalPrice || null);
    var totalStr = totalAmount ? formatPhp(totalAmount) : 'N/A';
    var savingsStr = quote ? formatPhp(quote.totalSavings) : '₱0';

    currentReservation = {
      startDate: data.startDate,
      endDate: data.endDate,
      guestName: data.guestName,
      guestEmail: data.guestEmail,
      guestPhone: data.guestPhone,
      guestCount: data.guestCount,
      referenceId: ref,
      totalPrice: totalAmount
    };

    document.getElementById('bookingForm').style.display = 'none';
    var confBox = document.getElementById('confirmationBox');
    confBox.style.display = 'block';

    document.getElementById('confText').innerHTML = 
      'Thank you, <strong>' + escapeHtml(data.guestName) + '</strong>! Your reservation for <strong>' + escapeHtml(String(data.guestCount)) + ' guest(s)</strong> ' +
      'at <strong>' + CONDO_UNIT_NAME + '</strong> from <strong>' + data.startDate + '</strong> to <strong>' + data.endDate + '</strong> is confirmed.<br><br>' +
      '<strong>Location:</strong> ' + CONDO_FULL_ADDRESS + '<br>' +
      '<strong>Reference ID:</strong> #' + ref + '<br>' +
      '<strong>Confirmed Total:</strong> ' + totalStr + ' <em>(Guaranteed savings: ' + savingsStr + ' vs 10km Tagaytay market)</em><br><br>' +
      'A confirmation email with full staycation check-in details has been dispatched to <em>' + escapeHtml(data.guestEmail) + '</em>.<br>' +
      'Your stay is scheduled in Google Calendar.';

    setupGoogleCalendarLink(ref, totalAmount);
    announceStatus('Reservation confirmed! Reference ID is ' + ref + '.');
    confBox.scrollIntoView({ behavior: 'smooth' });
  }

  function resetSubmitButton() {
    var submitBtn = document.getElementById('submitBtn');
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<span>Confirm and Lock in Reservation</span>';
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>'"]/g, function(tag) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag;
    });
  }

  function setupGoogleCalendarLink(refId, totalPrice) {
    var inVal = document.getElementById('checkInDate').value;
    var outVal = document.getElementById('checkOutDate').value;
    if (!inVal || !outVal) return;

    var s = inVal.replace(/-/g, '');
    var e = outVal.replace(/-/g, '');
    var priceDetail = totalPrice ? ('\\nTotal: ' + formatPhp(totalPrice)) : '';
    var title = encodeURIComponent("Staycation: Unit 418 Serin East Tagaytay (Ref #" + refId + ")");
    var details = encodeURIComponent("Unit 418 Serin East Tagaytay\\nRef #" + refId + priceDetail + "\\nCheck-in: 3:00 PM\\nCheck-out: 11:00 AM\\nAddress: " + CONDO_FULL_ADDRESS);
    var loc = encodeURIComponent(CONDO_FULL_ADDRESS);

    var proto = 'https:' + '//';
    var url = proto + 'calendar.google.com/calendar/render?action=TEMPLATE&text=' + title + '&dates=' + s + 'T150000/' + e + 'T110000&details=' + details + '&location=' + loc;
    var btn = document.getElementById('addToGoogleCalBtn');
    if (btn) btn.href = url;
  }

  function downloadIcsFile() {
    if (!currentReservation) return;
    var inVal = currentReservation.startDate.replace(/-/g, '');
    var outVal = currentReservation.endDate.replace(/-/g, '');
    var ref = currentReservation.referenceId;
    var slashSlash = '/' + '/';
    var priceLine = currentReservation.totalPrice ? ('\\nTotal: ' + formatPhp(currentReservation.totalPrice)) : '';

    var icsContent = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-" + slashSlash + "Condo Booking" + slashSlash + "EN",
      "BEGIN:VEVENT",
      "UID:condo-" + ref + "@booking.local",
      "DTSTAMP:" + toIso(new Date()).replace(/-/g, '') + "T000000Z",
      "DTSTART:" + inVal + "T150000",
      "DTEND:" + outVal + "T110000",
      "SUMMARY:Staycation: Unit 418 Serin East Tagaytay (Ref #" + ref + ")",
      "DESCRIPTION:Condo Staycation Ref #" + ref + "\\nGuest: " + currentReservation.guestName + "\\nGuests: " + currentReservation.guestCount + priceLine + "\\nAddress: " + CONDO_FULL_ADDRESS,
      "LOCATION:" + CONDO_FULL_ADDRESS,
      "STATUS:CONFIRMED",
      "END:VEVENT",
      "END:VCALENDAR"
    ].join("\r\n");

    var blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
    var link = document.createElement('a');
    link.href = window.URL.createObjectURL(blob);
    link.setAttribute('download', 'condo-staycation-' + ref + '.ics');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function announceStatus(msg) {
    var sr = document.getElementById('srAnnouncement');
    if (sr) sr.textContent = msg;
  }
</script>
